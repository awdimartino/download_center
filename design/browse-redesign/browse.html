<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse redesign</title>
<style>
  /* The live site's tokens (app/static/style.css), same as the Library
     mockup, so the decisions here are about layout and flow. */
  :root{
    color-scheme:dark;
    --bg:#101217; --panel:#191c23; --panel-2:#21252e; --panel-3:#282d38;
    --line:#2c313b; --line-soft:#232831;
    --text:#e7e9ee; --muted:#949ba8; --faint:#6d7481;
    --accent:#4ea1ff; --ok:#45c47a; --warn:#e0a33e; --bad:#e0574a;
    --tint-accent:color-mix(in srgb, var(--accent) 12%, transparent);
    --tint-warn:color-mix(in srgb, var(--warn) 12%, transparent);
    --tint-ok:color-mix(in srgb, var(--ok) 12%, transparent);
    --tint-bad:color-mix(in srgb, var(--bad) 12%, transparent);
    --on-accent:#071320;
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
    --t-xs:11px; --t-sm:12.5px; --t-md:13.5px; --t-lg:15px; --t-xl:17px; --t-2xl:21px;
    --r-sm:6px; --r-md:9px; --r-lg:12px;
    --shadow:0 1px 2px rgba(0,0,0,.28), 0 10px 26px -16px rgba(0,0,0,.8);
    --float-shadow:0 6px 20px rgba(0,0,0,.45);
    --ring:0 0 0 3px color-mix(in srgb, var(--accent) 34%, transparent);
    --rail:340px;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
       -webkit-font-smoothing:antialiased;overflow-x:clip;}
  button{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
         min-height:34px;padding:0 var(--s-3);border:0;border-radius:999px;
         background:color-mix(in srgb, var(--text) 7%, transparent);color:var(--text);
         font:inherit;font-size:var(--t-sm);white-space:nowrap;cursor:pointer;}
  button:hover{background:color-mix(in srgb, var(--text) 12%, transparent);}
  button:focus-visible{outline:none;box-shadow:var(--ring);}
  button.primary{background:var(--accent);color:var(--on-accent);font-weight:600;}
  button.primary:hover{background:color-mix(in srgb, var(--accent) 86%, #fff);}
  button.bare{background:none;padding:0 var(--s-2);}
  button.bare:hover{background:color-mix(in srgb, var(--text) 8%, transparent);}
  button:disabled{opacity:.4;cursor:default;}
  input{min-height:38px;padding:0 var(--s-3);border:1px solid transparent;border-radius:var(--r-md);
        background:color-mix(in srgb, var(--text) 6%, transparent);color:var(--text);font:inherit;font-size:16px;}
  input:focus-visible{outline:none;border-color:var(--accent);box-shadow:var(--ring);}

  /* ---- page: results on the left, downloads in a rail on the right ---- */
  .page{max-width:1320px;margin:0 auto;padding:var(--s-4) var(--s-4) 120px;}
  .titlebar{display:flex;align-items:center;gap:var(--s-3);margin-bottom:var(--s-4);}
  .burger{width:44px;height:44px;border-radius:999px;background:var(--panel-2);flex:none;flex-direction:column;gap:0;}
  .burger span{display:block;width:16px;height:2px;background:var(--text);margin:2px 0;border-radius:2px;}
  h1{font-size:var(--t-2xl);margin:0;font-weight:650;}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) var(--rail);gap:var(--s-6);align-items:start;}
  .main{min-width:0;}

  /* ---- the search: pinned, so it never scrolls away from the results ---- */
  .searchbar{position:sticky;top:0;z-index:5;padding:var(--s-2) 0 var(--s-3);
             background:linear-gradient(var(--bg) 82%, transparent);}
  .search{display:flex;gap:var(--s-2);}
  .field{flex:1;position:relative;}
  .field input{width:100%;min-height:46px;padding-left:42px;padding-right:38px;border-radius:999px;font-size:16px;
               background:var(--panel);}
  .field .icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;}
  .field .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:30px;width:30px;padding:0;background:none;color:var(--faint);}
  .search > button{min-height:46px;padding:0 var(--s-5);}
  .link-hint{display:flex;align-items:center;gap:var(--s-2);margin-top:var(--s-2);font-size:var(--t-sm);color:var(--accent);}
  .link-hint .dot{width:6px;height:6px;border-radius:999px;background:var(--accent);}
  .chips{display:flex;gap:var(--s-1);margin-top:var(--s-3);flex-wrap:wrap;}
  .chip{background:none;border:1px solid var(--line);color:var(--muted);min-height:30px;}
  .chip[aria-pressed=true]{background:var(--tint-accent);border-color:transparent;color:var(--accent);}

  /* ---- sections ---- */
  .section-title{font-size:var(--t-lg);font-weight:650;margin:var(--s-5) 0 var(--s-3);display:flex;align-items:baseline;gap:var(--s-2);}
  .section-title small{color:var(--faint);font-weight:500;font-size:var(--t-sm);}
  .section-title .see{margin-left:auto;color:var(--accent);background:none;min-height:26px;padding:0 var(--s-2);}

  /* ---- covers ---- */
  .art{display:block;overflow:hidden;background:var(--panel-2);position:relative;}
  .art svg{display:block;width:100%;height:100%;}

  /* ---- album cards: the cover carries its own download state ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s-5) var(--s-4);}
  .card{position:relative;cursor:pointer;border-radius:var(--r-md);outline:none;min-width:0;}
  .card:focus-visible{box-shadow:var(--ring);}
  .sleeve{position:relative;border-radius:var(--r-md);overflow:hidden;box-shadow:var(--shadow);}
  .sleeve .art{width:100%;aspect-ratio:1;transition:transform .15s ease;}
  .card:hover .sleeve .art{transform:scale(1.03);}
  .card-title{margin-top:var(--s-2);font-size:var(--t-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-sub{font-size:var(--t-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .flags{position:absolute;top:8px;left:8px;display:flex;gap:4px;z-index:2;}
  .flag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;
        background:rgba(16,18,23,.8);backdrop-filter:blur(6px);color:var(--text);}
  .flag.ok{color:var(--ok);}
  .flag.part{color:var(--muted);}
  .flag.bad{color:var(--bad);}
  /* The quick download, in the corner of the sleeve - shown on hover on a
     desktop, always there on a touch screen. */
  .quick{position:absolute;right:8px;bottom:8px;z-index:2;width:38px;height:38px;padding:0;
         background:var(--accent);color:var(--on-accent);box-shadow:var(--float-shadow);
         opacity:0;transform:translateY(4px);transition:opacity .15s, transform .15s;}
  .quick:hover{background:color-mix(in srgb, var(--accent) 86%, #fff);}
  .card:hover .quick,.card:focus-within .quick{opacity:1;transform:none;}
  @media (hover:none){.quick{opacity:1;transform:none;}}
  /* While downloading, the sleeve dims and fills from the bottom. */
  .veil{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;
        background:linear-gradient(transparent 30%, rgba(10,11,15,.85));}
  .veil-text{padding:0 10px 10px;font-size:var(--t-sm);font-weight:600;}
  .veil-text small{display:block;font-weight:500;color:var(--muted);font-size:var(--t-xs);}
  .veil-bar{height:4px;background:rgba(255,255,255,.12);}
  .veil-fill{height:100%;background:var(--accent);transition:width .4s ease;}

  /* ---- song rows ---- */
  .rows{display:flex;flex-direction:column;}
  .row{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto auto;align-items:center;gap:var(--s-3);
       padding:6px var(--s-2);border-radius:var(--r-md);}
  .row:hover{background:var(--panel);}
  .row .art{width:40px;height:40px;border-radius:var(--r-sm);}
  .row-main{min-width:0;}
  .row-title{font-size:var(--t-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub{font-size:var(--t-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row-sub a{color:inherit;text-decoration:none;cursor:pointer;}
  .row-sub a:hover{color:var(--text);text-decoration:underline;}
  .dur{color:var(--faint);font-size:var(--t-sm);font-variant-numeric:tabular-nums;}
  .state{font-size:var(--t-xs);font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;}
  .state.ok{color:var(--ok);background:var(--tint-ok);}
  .state.run{color:var(--accent);background:var(--tint-accent);}
  .state.wait{color:var(--muted);background:var(--panel-2);}
  .state.bad{color:var(--bad);background:var(--tint-bad);}
  .get{min-width:92px;}
  .row .get{background:none;border:1px solid var(--line);}
  .row .get:hover{border-color:transparent;background:var(--tint-accent);color:var(--accent);}
  .get svg{width:14px;height:14px;flex:none;}
  /* Already owned: still possible, but not the thing to press. */
  .get.quiet{color:var(--faint);border-color:var(--line-soft) !important;}

  /* ---- artists ---- */
  .artist-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:var(--s-4);}
  .artist{text-align:center;cursor:pointer;min-width:0;}
  .artist .art{width:100%;aspect-ratio:1;border-radius:999px;box-shadow:var(--shadow);}
  .artist-name{margin-top:var(--s-2);font-weight:600;font-size:var(--t-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .artist-sub{color:var(--muted);font-size:var(--t-sm);}
  .back{margin:var(--s-2) 0 var(--s-3);}
  .artist-head{display:flex;align-items:center;gap:var(--s-4);}
  .artist-head .art{width:96px;height:96px;border-radius:999px;flex:none;box-shadow:var(--shadow);}
  .artist-head h2{margin:0;font-size:var(--t-2xl);}

  .empty{color:var(--muted);text-align:center;padding:var(--s-6) 0;}
  .welcome{padding:var(--s-5) 0 0;}
  .welcome p{color:var(--muted);margin:0;max-width:60ch;font-size:var(--t-md);}

  /* ---- the downloads rail ---- */
  .rail{position:sticky;top:var(--s-4);max-height:calc(100vh - 32px);overflow-y:auto;overscroll-behavior:contain;
        background:var(--panel);border-radius:var(--r-lg);padding:var(--s-4) var(--s-3) var(--s-3);}
  .rail-head{display:flex;align-items:baseline;gap:var(--s-2);padding:0 var(--s-1) var(--s-2);}
  .rail-head h2{margin:0;font-size:var(--t-lg);font-weight:650;}
  .rail-head small{color:var(--muted);font-size:var(--t-sm);}
  .rail-head .x{margin-left:auto;display:none;}
  .group-head{display:flex;align-items:center;gap:var(--s-2);margin:var(--s-3) var(--s-1) var(--s-1);
              font-size:var(--t-sm);color:var(--muted);font-weight:600;}
  .group-head button{margin-left:auto;min-height:26px;font-size:var(--t-xs);}
  .group-head .twist{margin-left:0;background:none;padding:0 var(--s-1);color:var(--muted);font-size:var(--t-sm);font-weight:600;gap:6px;}
  .group-head .twist svg{transition:transform .15s;}
  .group-head .twist[aria-expanded=false] svg{transform:rotate(-90deg);}
  .job{border-radius:var(--r-md);}
  .job-head{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--s-3);align-items:center;
            padding:6px var(--s-1);border-radius:var(--r-md);cursor:pointer;}
  .job-head:hover{background:var(--panel-2);}
  .job-head .art{width:40px;height:40px;border-radius:var(--r-sm);}
  .job-title{font-size:var(--t-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .job-sub{font-size:var(--t-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .job-sub.bad{color:var(--bad);}
  .job-bar{height:3px;border-radius:2px;background:var(--panel-3);margin-top:5px;overflow:hidden;}
  .job-fill{height:100%;background:var(--accent);transition:width .4s ease;}
  .job .remove{width:28px;min-height:28px;padding:0;background:none;color:var(--faint);opacity:0;}
  .job-head:hover .remove,.job-head:focus-within .remove{opacity:1;}
  @media (hover:none){.job .remove{opacity:1;}}
  .job-tracks{padding:0 var(--s-1) var(--s-2) 56px;}
  .jt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s-2);font-size:var(--t-sm);padding:3px 0;
      border-bottom:1px solid var(--line-soft);}
  .jt:last-child{border-bottom:0;}
  .jt span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .jt .st{font-size:var(--t-xs);color:var(--faint);}
  .jt .st.complete{color:var(--ok);} .jt .st.downloading,.jt .st.tagging,.jt .st.matching{color:var(--accent);}
  .jt .st.failed{color:var(--bad);} .jt .st.skipped{color:var(--muted);}
  .job-actions{display:flex;gap:var(--s-2);padding:var(--s-1) 0 0;}
  .job-actions button{min-height:28px;font-size:var(--t-xs);}
  .finished .job-head{grid-template-columns:32px minmax(0,1fr) auto;padding:4px var(--s-1);}
  .finished .job-head .art{width:32px;height:32px;}
  .finished .job-title{font-weight:500;}
  .rail-empty{color:var(--muted);font-size:var(--t-sm);padding:var(--s-2) var(--s-1);}
  .spin{width:8px;height:8px;border-radius:999px;background:var(--accent);flex:none;animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.35;}}

  /* ---- the phone's version of the rail: a pill, then a sheet ---- */
  .pill-dock{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;display:none;
             align-items:center;gap:var(--s-2);padding:0 var(--s-4) 0 var(--s-3);min-height:46px;
             background:var(--panel-3);border-radius:999px;box-shadow:var(--float-shadow);font-size:var(--t-md);}
  .pill-dock .covers{display:flex;}
  .pill-dock .covers .art{width:26px;height:26px;border-radius:5px;margin-left:-8px;box-shadow:0 0 0 2px var(--panel-3);}
  .pill-dock .covers .art:first-child{margin-left:0;}
  .pill-dock .bad{color:var(--bad);}
  .scrim{position:fixed;inset:0;background:rgba(5,6,9,.55);z-index:40;}

  /* ---- album drawer, as in the Library ---- */
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);z-index:41;
          box-shadow:-20px 0 40px rgba(0,0,0,.4);overflow-y:auto;overscroll-behavior:contain;}
  .drawer-top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:var(--s-3);
              background:linear-gradient(var(--panel) 60%, transparent);}
  .drawer-body{padding:0 var(--s-5) var(--s-6);}
  .hero{display:flex;gap:var(--s-4);align-items:flex-end;}
  .hero .sleeve{width:168px;flex:none;}
  .hero h2{margin:0 0 2px;font-size:var(--t-2xl);line-height:1.2;}
  .hero .by{color:var(--accent);cursor:pointer;font-weight:600;}
  .hero .meta{color:var(--muted);font-size:var(--t-sm);margin-top:var(--s-1);}
  .actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2);margin:var(--s-4) 0;}
  .actions .note{font-size:var(--t-sm);color:var(--muted);}
  .tracks{border-top:1px solid var(--line-soft);}
  .trk{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto auto;align-items:center;gap:var(--s-3);
       padding:6px var(--s-1);border-bottom:1px solid var(--line-soft);font-size:var(--t-md);}
  .trk .no{color:var(--faint);text-align:right;font-variant-numeric:tabular-nums;}
  .trk .t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .trk.held .t{color:var(--muted);}
  .trk .get{min-width:0;min-height:28px;background:none;color:var(--muted);}
  .trk .get:hover{color:var(--accent);background:var(--tint-accent);}

  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:var(--s-3);
         padding:var(--s-2) var(--s-4);background:var(--panel-3);border-radius:999px;box-shadow:var(--float-shadow);
         font-size:var(--t-md);max-width:calc(100% - 32px);}
  @media (min-width:981px){.toast{bottom:24px;}}

  .mock-note{margin-top:var(--s-6);color:var(--faint);font-size:var(--t-sm);border-top:1px solid var(--line-soft);padding-top:var(--s-3);max-width:80ch;}

  @media (max-width:980px){
    .layout{grid-template-columns:1fr;}
    .rail{display:none;}
    .pill-dock{display:flex;}
    /* Open on a phone, the rail becomes a sheet from the bottom. */
    body.sheet-open .rail{display:block;position:fixed;left:0;right:0;bottom:0;top:auto;z-index:41;
      max-height:78vh;border-radius:var(--r-lg) var(--r-lg) 0 0;padding-bottom:var(--s-6);box-shadow:var(--float-shadow);}
    body.sheet-open .rail-head .x{display:inline-flex;}
  }
  @media (max-width:640px){
    .grid{grid-template-columns:repeat(2,1fr);gap:var(--s-4) var(--s-3);}
    .artist-row{grid-template-columns:repeat(3,1fr);}
    .search > button{padding:0 var(--s-4);}
    /* On a phone the button keeps only its arrow, so the state badge
       still fits beside the title. */
    .row{grid-template-columns:40px minmax(0,1fr) auto auto;gap:var(--s-2);}
    .row .dur{display:none;}
    .get{min-width:0;width:36px;padding:0;}
    .get .lbl{display:none;}
    .drawer{width:100%;}
    .drawer-body{padding:0 var(--s-4) var(--s-6);}
    .hero{flex-direction:column;align-items:flex-start;}
    .hero .sleeve{width:100%;}
    .trk{grid-template-columns:24px minmax(0,1fr) auto auto;}
    .trk .dur{display:none;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>
<body>
<div class="page">
  <div class="titlebar">
    <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    <h1>Browse</h1>
  </div>

  <div class="layout">
    <div class="main">
      <div class="searchbar">
        <form class="search" id="search" autocomplete="off">
          <label class="field">
            <svg class="icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="text" spellcheck="false" aria-label="Search Spotify, or paste a link"
                   placeholder="Search Spotify, or paste a link">
            <button type="button" class="clear" id="clear" aria-label="Clear search">✕</button>
          </label>
          <button class="primary" id="go" type="submit">Search</button>
        </form>
        <div class="link-hint" id="link-hint" hidden><span class="dot"></span><span id="link-text"></span></div>
        <div class="chips" id="chips" role="group" aria-label="Show">
          <button class="chip" data-kind="all">All</button>
          <button class="chip" data-kind="album">Albums</button>
          <button class="chip" data-kind="track">Songs</button>
          <button class="chip" data-kind="artist">Artists</button>
        </div>
      </div>
      <div id="results"></div>
    </div>

    <aside class="rail" id="rail" aria-label="Downloads"></aside>
  </div>

  <p class="mock-note">Mockup · generated covers, invented catalog. The downloads simulate progress. Try:
    press the download button on a cover, open an album, type a different artist, paste a link (anything starting
    with https://), and narrow the window below 980px to see the phone layout.</p>
</div>

<button class="pill-dock" id="pill" aria-label="Show downloads"></button>
<div id="drawer-root"></div>
<div id="toast-root"></div>

<script src="../home-mockups/data.js"></script>
<script>
"use strict";

/* ===== catalog: a stand-in for what Spotify search returns =================== */

const PAL = [
  ['#1E2A44','#4EA1FF','#F2C46D','#0F1524','#7FB3E6'],
  ['#2B1D3A','#E8704A','#F5C77E','#14101C','#3B2A4F'],
  ['#12261E','#45C47A','#D8E8B0','#0A1611','#2E5E47'],
  ['#3A1620','#E0574A','#F4D3C4','#1C0B10','#8A2E3B'],
  ['#2A2A2E','#E7E9EE','#949BA8','#141418','#5B606B'],
  ['#2E2412','#E0A33E','#F7E6C1','#17110A','#7A5A24'],
];
const pal = (s) => PAL[(hashStr(s) >> 2) % PAL.length];

let nid = 1;
const CAT_ARTISTS = {};
const CAT_ALBUMS = [];
function artist(name, followers) { CAT_ARTISTS[name] = { name, followers, id: 'ar' + nid++ }; }
// held: indexes of tracks already in the library (read from Navidrome).
function album(artistName, name, year, tracks, held = []) {
  const id = 'al' + nid++;
  const a = { id, artist: artistName, name, year, seed: artistName + name,

/* ===== the queue: what the server would push over the websocket =============== */

let jid = 1;
const JOBS = [];
// kind: 'album' | 'track'. items mirror the server's per-track status.
function job(kind, a, trackIdx, preset) {
  const tracks = kind === 'album' ? a.tracks : [a.tracks[trackIdx]];
  const j = { id: jid++, kind, album: a, title: kind === 'album' ? a.name : tracks[0].name,
    items: tracks.map(t => ({ id: t.id, name: t.name, status: t.held ? 'skipped' : 'queued', progress: 0 })),
    created: Date.now() - (preset?.ago || 0) };
  // A seeded job is history: its tracks are held *because* it downloaded them.
  if (preset?.status) j.items.forEach((it, i) => { it.status = preset.status(i); });
  JOBS.unshift(j);
  return j;
}
const find = (n) => CAT_ALBUMS.find(a => a.name === n);

const jobDone = (j) => j.items.every(i => i.status === 'complete' || i.status === 'skipped');
const jobFailed = (j) => !jobDone(j) && j.items.every(i => ['complete','skipped','failed'].includes(i.status));
const jobActive = (j) => !jobDone(j) && !jobFailed(j);
const doneCount = (j) => j.items.filter(i => i.status === 'complete' || i.status === 'skipped').length;
const jobProgress = (j) => {
  const cur = j.items.find(i => i.status === 'downloading');
  return (doneCount(j) + (cur ? cur.progress : 0)) / j.items.length;
};
// What the queue currently says about one track or one album, for the
// state shown on the result itself.
function trackState(t) {
  for (const j of JOBS) {
    const it = j.items.find(i => i.id === t.id);
    if (it && it.status !== 'skipped' && !(it.status === 'complete' && t.held)) return it.status;
  }
  return t.held ? 'held' : null;
}
function albumJob(a) { return JOBS.find(j => j.kind === 'album' && j.album.id === a.id); }

// The simulated server: one track at a time per job, two jobs at once.
setInterval(() => {
  let running = 0;
  for (const j of [...JOBS].reverse()) {
    if (!jobActive(j) || running >= 2) continue;
    running++;
    let it = j.items.find(i => ['matching','downloading','tagging'].includes(i.status));
    if (!it) { it = j.items.find(i => i.status === 'queued'); if (it) it.status = 'matching'; continue; }
    if (it.status === 'matching') it.status = 'downloading';
    else if (it.status === 'downloading') { it.progress = Math.min(1, it.progress + 0.34); if (it.progress >= 1) it.status = 'tagging'; }
    else if (it.status === 'tagging') { it.status = 'complete'; if (jobDone(j)) toast(`${j.title} is in your library`); }
  }
  renderRail(); paintStates();
}, 700);

/* ===== search ================================================================ */

function search(q) {
  q = q.trim().toLowerCase();
  if (!q) return null;
  const hit = (s) => s.toLowerCase().includes(q);
  const artists = Object.values(CAT_ARTISTS).filter(a => hit(a.name));
  const albums = CAT_ALBUMS.filter(a => hit(a.name) || hit(a.artist));
  const tracks = allTracks().filter(t => hit(t.name) || hit(t.album.artist))
    .sort((x, y) => (hit(y.name) - hit(x.name)) || (y.album.year - x.album.year));
  return { artists, albums, tracks };
}

  if (heldN) return `<span class="flags"><span class="flag part">${heldN} of ${a.tracks.length} in library</span></span>${quick}`;

function renderRail() {
  const active = JOBS.filter(jobActive), failed = JOBS.filter(jobFailed), done = JOBS.filter(jobDone);

        <div class="tracks" id="drawer-tracks"></div>
      </div>
    </aside>`;
  paintDrawerTracks();
  paintStates();
}
function paintDrawerTracks() {
  const a = albumById(S.open);
  if (!a || !$('#drawer-tracks')) return;
  const heldN = a.tracks.filter(t => t.held).length;
  const j = albumJob(a);
  let actions;
  if (j && jobActive(j)) actions = `<button class="primary" disabled>Downloading…</button><span class="note">${doneCount(j)} of ${j.items.length} tracks so far</span>`;
  else if (heldN === a.tracks.length || (j && jobDone(j))) actions = `<button data-dl-album="${a.id}">Download again</button><span class="note">Already in your library. Again makes a second copy.</span>`;
  else if (heldN) actions = `<button class="primary" data-dl-album="${a.id}">Download album</button><span class="note">${heldN} of ${a.tracks.length} already in your library — those are skipped</span>`;
  else actions = `<button class="primary" data-dl-album="${a.id}">Download album</button>`;
  $('#drawer-actions').innerHTML = actions;
  $('#drawer-tracks').innerHTML = a.tracks.map(t => {
    const st = trackState(t);
    return `<div class="trk ${t.held ? 'held' : ''}"><span class="no">${t.no}</span><span class="t">${esc(t.name)}</span>
      ${stateBadge(st)}<span class="dur">${mmss(t.dur)}</span>${trackButton({ ...t, album: a }, 'get')}</div>`;
  }).join('');
}

/* ===== actions =============================================================== */

function toast(msg) {
  const root = $('#toast-root');
  root.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => root.innerHTML = '', 2600);
}
function downloadAlbum(id) {
  const a = albumById(id);
  job('album', a);
  toast(`Queued ${a.name}`);
  renderRail(); paintStates();
}
function downloadTrack(id) {
  const t = allTracks().find(x => x.id === id);
  const failed = JOBS.find(j => j.items.some(i => i.id === id && i.status === 'failed'));
  if (failed) { failed.items.forEach(i => { if (i.id === id) i.status = 'queued'; }); }
  else job('track', t.album, t.no - 1);
  toast(`Queued ${t.name}`);
  renderRail(); paintStates();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-act],[data-open],[data-artist],[data-dl-album],[data-dl-track],[data-job],[data-remove],[data-retry],[data-kind-jump],.chip');
  if (!t) return;
  if (t.dataset.dlAlbum) { e.stopPropagation(); return downloadAlbum(t.dataset.dlAlbum); }
  if (t.dataset.dlTrack) return downloadTrack(t.dataset.dlTrack);
  if (t.dataset.remove) { e.stopPropagation(); JOBS.splice(JOBS.findIndex(j => j.id === +t.dataset.remove), 1); renderRail(); return paintStates(); }
  if (t.dataset.retry) { JOBS.find(j => j.id === +t.dataset.retry).items.forEach(i => { if (i.status === 'failed') i.status = 'queued'; }); renderRail(); return paintStates(); }
  if (t.dataset.job) { const id = +t.dataset.job; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); return renderRail(); }
  if (t.dataset.kindJump) { S.kind = t.dataset.kindJump; return renderResults(); }
  if (t.classList.contains('chip')) { S.kind = t.dataset.kind; return renderResults(); }
  if (t.dataset.open) { S.open = t.dataset.open; return renderDrawer(); }
  if (t.dataset.artist) { S.artist = t.dataset.artist; S.open = null; renderDrawer(); window.scrollTo(0, 0); return renderResults(); }
  const act = t.dataset.act;
  if (act === 'close') { S.open = null; renderDrawer(); }
  if (act === 'artist-back') { S.artist = null; renderResults(); }
  if (act === 'toggle-finished') { S.showFinished = !S.showFinished; renderRail(); }
  if (act === 'clear-finished') { for (let i = JOBS.length - 1; i >= 0; i--) if (jobDone(JOBS[i])) JOBS.splice(i, 1); renderRail(); }
  if (act === 'sheet-close') { document.body.classList.remove('sheet-open'); renderRail(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (S.open) { S.open = null; renderDrawer(); } document.body.classList.remove('sheet-open'); renderRail(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-job],.card,.artist')) { e.preventDefault(); e.target.click(); }
});
$('#pill').addEventListener('click', () => { document.body.classList.add('sheet-open'); renderRail(); });

/* ===== the search box ======================================================== */

const input = $('#q');
function syncBox() {
  const v = input.value;
  const url = isUrl(v);
  $('#go').textContent = url ? 'Download' : 'Search';
  $('#clear').hidden = !v;
  $('#link-hint').hidden = !url;
  if (url) {
    const host = (v.match(/^https?:\/\/([^/]+)/i) || [])[1] || 'that site';
    const what = /playlist/.test(v) ? 'playlist' : /album/.test(v) ? 'album' : /track|watch/.test(v) ? 'track' : 'link';
    $('#link-text').textContent = `A ${what} link from ${host.replace(/^(www|open)\./, '')}. Press Download to queue it.`;
  }
}
let debounce;
input.addEventListener('input', () => {
  syncBox();
  clearTimeout(debounce);
  // Results follow the typing, the way the Library's search does.
  debounce = setTimeout(() => { S.q = input.value; S.artist = null; renderResults(); }, 250);
});
$('#clear').addEventListener('click', () => { input.value = ''; S.q = ''; S.artist = null; syncBox(); renderResults(); input.focus(); });
$('#search').addEventListener('submit', (e) => {
  e.preventDefault();
  if (isUrl(input.value)) {
    const a = CAT_ALBUMS[(hashStr(input.value) % CAT_ALBUMS.length)];
    job('album', a);
    toast('Queued the link');
    input.value = ''; S.q = ''; syncBox(); renderResults(); renderRail();
    return;
  }
  S.q = input.value; S.artist = null; renderResults();
});

input.value = S.q;
syncBox();
renderResults();
renderRail();
</script>
</body>
