<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library redesign</title>
<style>
  /* The live site's tokens (app/static/style.css), so this reads as the
     real app and the decisions are about layout and flow, not colour. */
  :root{
    color-scheme:dark;
    --bg:#101217; --panel:#191c23; --panel-2:#21252e; --panel-3:#282d38;
    --line:#2c313b; --line-soft:#232831;
    --text:#e7e9ee; --muted:#949ba8; --faint:#6d7481;
    --accent:#4ea1ff; --ok:#45c47a; --warn:#e0a33e; --bad:#e0574a;
    --tint-accent:color-mix(in srgb, var(--accent) 12%, transparent);
    --tint-warn:color-mix(in srgb, var(--warn) 12%, transparent);
    --tint-ok:color-mix(in srgb, var(--ok) 12%, transparent);
    --on-accent:#071320;
    --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px;
    --t-xs:11px; --t-sm:12.5px; --t-md:13.5px; --t-lg:15px; --t-xl:17px; --t-2xl:21px;
    --r-sm:6px; --r-md:9px; --r-lg:12px;
    --shadow:0 1px 2px rgba(0,0,0,.28), 0 10px 26px -16px rgba(0,0,0,.8);
    --float-shadow:0 6px 20px rgba(0,0,0,.45);
    --ring:0 0 0 3px color-mix(in srgb, var(--accent) 34%, transparent);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
       -webkit-font-smoothing:antialiased;overflow-x:clip;}
  button{display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
         min-height:34px;padding:0 var(--s-3);border:0;border-radius:999px;
         background:color-mix(in srgb, var(--text) 7%, transparent);color:var(--text);
         font:inherit;font-size:var(--t-sm);white-space:nowrap;cursor:pointer;}
  button:hover{background:color-mix(in srgb, var(--text) 12%, transparent);}
  button:focus-visible{outline:none;box-shadow:var(--ring);}
  button.primary{background:var(--accent);color:var(--on-accent);font-weight:600;}
  button.primary:hover{background:color-mix(in srgb, var(--accent) 86%, #fff);}
  button.bare{background:none;padding:0 var(--s-2);}
  button.bare:hover{background:color-mix(in srgb, var(--text) 8%, transparent);}
  button.danger:hover{color:var(--bad);background:color-mix(in srgb, var(--bad) 12%, transparent);}
  button:disabled{opacity:.4;cursor:default;}
  input:not([type=checkbox]):not([type=radio]),select{
    min-height:38px;padding:0 var(--s-3);border:1px solid transparent;border-radius:var(--r-md);
    background:color-mix(in srgb, var(--text) 6%, transparent);color:var(--text);font:inherit;font-size:16px;}
  input:focus-visible,select:focus-visible{outline:none;border-color:var(--accent);box-shadow:var(--ring);}
  input[type=checkbox],input[type=radio]{width:17px;height:17px;margin:0;accent-color:var(--accent);cursor:pointer;}

  /* ---- page ---- */
  .page{max-width:1240px;margin:0 auto;padding:var(--s-4) var(--s-4) 120px;}
  .titlebar{display:flex;align-items:center;gap:var(--s-3);margin-bottom:var(--s-4);}
  .burger{width:44px;height:44px;border-radius:999px;background:var(--panel-2);flex:none;}
  .burger span{display:block;width:16px;height:2px;background:var(--text);margin:2px 0;border-radius:2px;}
  .burger{flex-direction:column;gap:0;}
  h1{font-size:var(--t-2xl);margin:0;font-weight:650;}
  .count{color:var(--muted);font-size:var(--t-sm);margin-left:auto;}

  /* Three ways in, one row. Each answers a different question:
     what do I have, whose is it, and what needs fixing. */
  .tabs{display:flex;gap:var(--s-1);padding:var(--s-1);background:var(--panel);border-radius:999px;width:max-content;max-width:100%;overflow-x:auto;}
  .tab{background:none;color:var(--muted);}
  .tab[aria-selected=true]{background:var(--panel-3);color:var(--text);}
  .badge{display:inline-block;min-width:18px;padding:1px 6px;border-radius:999px;background:var(--warn);color:#1a1204;font-size:var(--t-xs);font-weight:700;}

  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2);margin:var(--s-4) 0;}
  .search{flex:1 1 260px;position:relative;}
  .search input{width:100%;padding-left:36px;}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint);}
  .chips{display:flex;gap:var(--s-1);flex-wrap:wrap;}
  .chip{background:none;border:1px solid var(--line);color:var(--muted);min-height:30px;}
  .chip[aria-pressed=true]{background:var(--tint-accent);border-color:transparent;color:var(--accent);}
  .seg{display:flex;background:var(--panel);border-radius:999px;padding:2px;}
  .seg button{background:none;min-height:30px;padding:0 10px;color:var(--muted);}
  .seg button[aria-pressed=true]{background:var(--panel-3);color:var(--text);}
  .select-toggle[aria-pressed=true]{background:var(--accent);color:var(--on-accent);}

  /* ---- suggestion ---- */
  .suggest{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);
           border-radius:var(--r-lg);background:linear-gradient(90deg,var(--tint-accent),transparent 80%);
           border:1px solid color-mix(in srgb, var(--accent) 25%, transparent);margin-bottom:var(--s-4);}
  .suggest-covers{display:flex;flex:none;}
  .suggest-covers .art{width:34px;height:34px;border-radius:5px;margin-left:-10px;box-shadow:0 0 0 2px var(--bg);}
  .suggest-covers .art:first-child{margin-left:0;}
  .suggest-text{flex:1;min-width:0;font-size:var(--t-md);}
  .suggest-text small{display:block;color:var(--muted);font-size:var(--t-sm);}

  /* ---- album grid ---- */
  .section-title{font-size:var(--t-lg);font-weight:650;margin:var(--s-5) 0 var(--s-3);display:flex;align-items:baseline;gap:var(--s-2);}
  .section-title small{color:var(--faint);font-weight:500;font-size:var(--t-sm);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--s-5) var(--s-4);}
  .card{position:relative;cursor:pointer;border-radius:var(--r-md);outline:none;}
  .card:focus-visible{box-shadow:var(--ring);}
  .card .art{width:100%;aspect-ratio:1;border-radius:var(--r-md);box-shadow:var(--shadow);transition:transform .15s ease;}
  .card:hover .art{transform:translateY(-2px);}
  .card-title{margin-top:var(--s-2);font-size:var(--t-md);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-sub{font-size:var(--t-sm);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .flags{position:absolute;top:8px;left:8px;display:flex;gap:4px;}
  .flag{font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 7px;border-radius:999px;
        background:rgba(16,18,23,.78);backdrop-filter:blur(6px);color:var(--text);}
  .flag.warn{color:var(--warn);}
  .tick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:999px;
        background:rgba(16,18,23,.7);border:2px solid rgba(231,233,238,.7);display:none;align-items:center;justify-content:center;}
  .selecting .tick{display:flex;}
  .card.picked .tick{background:var(--accent);border-color:var(--accent);}
  .card.picked .art{box-shadow:0 0 0 3px var(--accent);}
  .tick svg{display:none;color:var(--on-accent);}
  .picked .tick svg{display:block;}

  /* ---- art: generated sleeves, and the barred YouTube frame ---- */
  .art{display:block;overflow:hidden;background:var(--panel-2);position:relative;}
  .art svg{display:block;width:100%;height:100%;}
  /* What Navidrome shows today for a YouTube download: a 16:9 frame,
     letterboxed into the square tile, with bars either side of the cover. */
  .art.barred{background:#000;display:flex;align-items:center;}
  .art.barred .frame{width:100%;aspect-ratio:16/9;background:#050506;display:flex;justify-content:center;}
  .art.barred .frame svg{width:auto;height:100%;aspect-ratio:1;}

  /* ---- list layout ---- */
  .rows{display:flex;flex-direction:column;}
  .row{display:grid;grid-template-columns:auto 44px 1fr auto auto;align-items:center;gap:var(--s-3);
       padding:var(--s-2);border-radius:var(--r-md);cursor:pointer;}
  .row:hover{background:var(--panel);}
  .row .art{width:44px;height:44px;border-radius:var(--r-sm);}
  .row .tickbox{width:17px;display:none;}
  .selecting .row .tickbox{display:block;}
  .row.picked{background:var(--tint-accent);}
  .row-main{min-width:0;}
  .row-meta{color:var(--muted);font-size:var(--t-sm);font-variant-numeric:tabular-nums;}
  .row .flags{position:static;}
  .row .flag{background:var(--panel-2);}

  /* ---- tracks in search results ---- */
  .track-hits .row{grid-template-columns:auto 36px 1fr auto;}
  .track-hits .row .art{width:36px;height:36px;}

  /* ---- artists ---- */
  .artist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:var(--s-5) var(--s-4);}
  .artist{text-align:center;cursor:pointer;}
  .artist .stack{position:relative;width:100%;aspect-ratio:1;border-radius:999px;overflow:hidden;box-shadow:var(--shadow);
                 display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;}
  .artist .stack .art{width:100%;height:100%;}
  .artist .stack.one{display:block;}
  .artist-name{margin-top:var(--s-2);font-weight:600;font-size:var(--t-md);}
  .artist-sub{color:var(--muted);font-size:var(--t-sm);}
  .back{margin-bottom:var(--s-3);}
  .artist-head{display:flex;align-items:center;gap:var(--s-4);margin-bottom:var(--s-2);}
  .artist-head .stack{width:88px;flex:none;}
  .artist-head h2{margin:0;font-size:var(--t-2xl);}

  /* ---- needs attention ---- */
  .todo{background:var(--panel);border-radius:var(--r-lg);padding:var(--s-4);margin-bottom:var(--s-4);}
  .todo-head{display:flex;align-items:center;gap:var(--s-3);flex-wrap:wrap;}
  .todo-icon{width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700;}
  .todo-head h3{margin:0;font-size:var(--t-lg);}
  .todo-head p{margin:0;color:var(--muted);font-size:var(--t-sm);}
  .todo-head .grow{flex:1;min-width:200px;}
  .todo-strip{display:flex;gap:var(--s-3);overflow-x:auto;padding:var(--s-3) 0 var(--s-1);}
  .todo-strip .mini{flex:0 0 108px;cursor:pointer;}
  .todo-strip .mini .art{width:108px;height:108px;border-radius:var(--r-sm);}
  .mini-title{font-size:var(--t-sm);margin-top:var(--s-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mini-sub{font-size:var(--t-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .group{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) 0;border-top:1px solid var(--line-soft);}
  .group:first-of-type{border-top:0;}
  .group .suggest-covers .art{width:40px;height:40px;}
  .done{color:var(--ok);font-size:var(--t-sm);}

  /* ---- detail drawer ---- */
  .scrim{position:fixed;inset:0;background:rgba(5,6,9,.55);z-index:20;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--panel);z-index:21;
          box-shadow:-20px 0 40px rgba(0,0,0,.4);overflow-y:auto;overscroll-behavior:contain;}
  .drawer-top{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:var(--s-3);
              background:linear-gradient(var(--panel) 60%, transparent);}
  .drawer-body{padding:0 var(--s-5) var(--s-6);}
  .hero{display:flex;gap:var(--s-4);align-items:flex-end;}
  .hero .art{width:168px;height:168px;flex:none;border-radius:var(--r-md);box-shadow:var(--shadow);}
  .hero h2{margin:0 0 2px;font-size:var(--t-2xl);line-height:1.2;}
  .hero .by{color:var(--accent);cursor:pointer;font-weight:600;}
  .hero .meta{color:var(--muted);font-size:var(--t-sm);margin-top:var(--s-1);}
  .status{display:flex;flex-wrap:wrap;gap:var(--s-1);margin-top:var(--s-3);}
  .pill{font-size:var(--t-xs);padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted);}
  .pill.ok{color:var(--ok);background:var(--tint-ok);}
  .pill.warn{color:var(--warn);background:var(--tint-warn);}
  .actions{display:flex;flex-wrap:wrap;gap:var(--s-2);margin:var(--s-4) 0;}
  .more-menu{position:relative;}
  .menu{position:absolute;right:0;top:40px;z-index:5;min-width:220px;background:var(--panel-3);border-radius:var(--r-md);
        box-shadow:var(--float-shadow);padding:var(--s-1);display:flex;flex-direction:column;}
  .menu button{justify-content:flex-start;background:none;border-radius:var(--r-sm);}
  .menu button:hover{background:color-mix(in srgb, var(--text) 8%, transparent);}
  .edit-box{background:var(--panel-2);border-radius:var(--r-md);padding:var(--s-3);display:grid;gap:var(--s-2);margin-bottom:var(--s-4);}
  .edit-box label{display:flex;flex-direction:column;gap:2px;font-size:var(--t-sm);color:var(--muted);}
  .edit-box .btns{display:flex;gap:var(--s-2);justify-content:flex-end;}
  .covers{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-2);margin-bottom:var(--s-4);}
  .covers button{flex-direction:column;align-items:stretch;padding:var(--s-1);border-radius:var(--r-md);background:none;min-height:0;white-space:normal;gap:2px;}
  .covers button:hover{background:var(--tint-accent);}
  .covers .art{width:100%;aspect-ratio:1;border-radius:var(--r-sm);}
  .covers span{font-size:var(--t-xs);color:var(--muted);text-align:left;line-height:1.3;}
  .covers-head{font-size:var(--t-sm);color:var(--muted);margin-bottom:var(--s-2);display:flex;justify-content:space-between;align-items:center;}

  .tracks{border-top:1px solid var(--line-soft);}
  .trk{display:grid;grid-template-columns:auto 28px 1fr auto auto;align-items:center;gap:var(--s-3);
       padding:7px var(--s-1);border-bottom:1px solid var(--line-soft);font-size:var(--t-md);}
  .trk .tickbox{display:none;}
  .selecting-tracks .trk .tickbox{display:block;}
  .trk.picked{background:var(--tint-accent);}
  .trk .no{color:var(--faint);text-align:right;font-variant-numeric:tabular-nums;}
  .trk .t{min-width:0;}
  .trk .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .trk .t small{color:var(--muted);font-size:var(--t-sm);}
  .trk .dur{color:var(--faint);font-size:var(--t-sm);font-variant-numeric:tabular-nums;}
  .trk .edit{opacity:0;}
  .trk:hover .edit,.trk:focus-within .edit{opacity:1;}
  .trk input{min-height:30px !important;width:100%;}
  .tracks-head{display:flex;justify-content:space-between;align-items:center;margin:var(--s-5) 0 var(--s-2);}
  .tracks-head h3{margin:0;font-size:var(--t-md);color:var(--muted);font-weight:600;}

  /* ---- selection bar ---- */
  .bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:30;
       display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-2) var(--s-2) var(--s-4);
       background:var(--panel-3);border-radius:999px;box-shadow:var(--float-shadow);
       max-width:calc(100% - 32px);}
  .bar .what{font-size:var(--t-md);white-space:nowrap;margin-right:var(--s-2);}
  .bar .what b{color:var(--accent);}

  /* ---- combine dialog ---- */
  .dialog{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:var(--s-4);background:rgba(5,6,9,.6);}
  .sheet{width:min(720px,100%);max-height:calc(100vh - 32px);overflow-y:auto;background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--float-shadow);}
  .sheet-head{padding:var(--s-4) var(--s-5);border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--panel);z-index:2;}
  .sheet-head h2{margin:0;font-size:var(--t-xl);}
  .sheet-head p{margin:2px 0 0;color:var(--muted);font-size:var(--t-sm);}
  .sheet-body{padding:var(--s-4) var(--s-5);display:grid;gap:var(--s-5);}
  .step h3{margin:0 0 var(--s-2);font-size:var(--t-sm);text-transform:uppercase;letter-spacing:.08em;color:var(--faint);}
  .target{display:grid;grid-template-columns:auto 40px 1fr;gap:var(--s-3);align-items:center;padding:var(--s-2) var(--s-3);
          border-radius:var(--r-md);cursor:pointer;border:1px solid transparent;}
  .target:hover{background:var(--panel-2);}
  .target.on{border-color:color-mix(in srgb, var(--accent) 50%, transparent);background:var(--tint-accent);}
  .target .art{width:40px;height:40px;border-radius:var(--r-sm);}
  .target small{display:block;color:var(--muted);font-size:var(--t-sm);}
  .target .plus{width:40px;height:40px;border-radius:var(--r-sm);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2);margin-top:var(--s-2);}
  .fields label{display:flex;flex-direction:column;gap:2px;font-size:var(--t-sm);color:var(--muted);}
  .note{font-size:var(--t-sm);color:var(--muted);margin:var(--s-2) 0 0;}
  .note.warn{color:var(--warn);}
  .order{border:1px solid var(--line-soft);border-radius:var(--r-md);overflow:hidden;}
  .ord{display:grid;grid-template-columns:20px 28px 1fr auto auto;gap:var(--s-2);align-items:center;padding:6px var(--s-3);
       border-bottom:1px solid var(--line-soft);font-size:var(--t-md);background:var(--panel);}
  .ord:last-child{border-bottom:0;}
  .ord.dragging{opacity:.4;}
  .ord.over{box-shadow:inset 0 2px 0 var(--accent);}
  .ord .grip{cursor:grab;color:var(--faint);user-select:none;}
  .ord .no{color:var(--faint);text-align:right;font-variant-numeric:tabular-nums;}
  .ord .from{color:var(--faint);font-size:var(--t-xs);}
  .ord .dupe{color:var(--warn);font-size:var(--t-xs);}
  .ord .t{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ord .moves{display:flex;}
  .ord .moves button{min-height:26px;padding:0 6px;background:none;color:var(--faint);}
  .opt{display:flex;align-items:center;gap:var(--s-2);font-size:var(--t-md);margin-top:var(--s-2);cursor:pointer;}
  .cover-pick{display:flex;gap:var(--s-2);flex-wrap:wrap;}
  .cover-pick label{cursor:pointer;position:relative;}
  .cover-pick input{position:absolute;opacity:0;}
  .cover-pick .art{width:64px;height:64px;border-radius:var(--r-sm);}
  .cover-pick input:checked + .art{box-shadow:0 0 0 3px var(--accent);}
  .cover-pick input:focus-visible + .art{box-shadow:var(--ring);}
  .sheet-foot{display:flex;justify-content:flex-end;align-items:center;gap:var(--s-2);padding:var(--s-3) var(--s-5);
              border-top:1px solid var(--line-soft);position:sticky;bottom:0;background:var(--panel);}
  .sheet-foot .summary{margin-right:auto;color:var(--muted);font-size:var(--t-sm);}

  /* ---- toast ---- */
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:var(--s-3);
         padding:var(--s-2) var(--s-2) var(--s-2) var(--s-4);background:var(--panel-3);border-radius:999px;box-shadow:var(--float-shadow);
         font-size:var(--t-md);max-width:calc(100% - 32px);}
  .toast button{color:var(--accent);}

  .empty{color:var(--muted);text-align:center;padding:var(--s-6) 0;}
  .mock-note{margin-top:var(--s-6);color:var(--faint);font-size:var(--t-sm);border-top:1px solid var(--line-soft);padding-top:var(--s-3);}

  @media (max-width:640px){
    .grid{grid-template-columns:repeat(2,1fr);gap:var(--s-4) var(--s-3);}
    .artist-grid{grid-template-columns:repeat(3,1fr);gap:var(--s-4) var(--s-3);}
    .drawer{width:100%;}
    .drawer-body{padding:0 var(--s-4) var(--s-6);}
    .hero{flex-direction:column;align-items:flex-start;}
    .hero .art{width:100%;height:auto;aspect-ratio:1;}
    .covers{grid-template-columns:repeat(2,1fr);}
    .fields{grid-template-columns:1fr;}
    .bar{left:16px;right:16px;transform:none;border-radius:var(--r-lg);flex-wrap:wrap;}
    .bar .what{flex-basis:100%;}
    .dialog{padding:0;align-items:stretch;}
    .sheet{max-height:100vh;border-radius:0;}
    .sheet-body,.sheet-head,.sheet-foot{padding-left:var(--s-4);padding-right:var(--s-4);}
    .row{grid-template-columns:auto 44px 1fr auto;}
    .row .row-meta.hide-sm{display:none;}
    .count{display:none;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>
<div class="page">
  <div class="titlebar">
    <button class="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    <h1>Library</h1>
    <span class="count" id="count"></span>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-view="albums">Albums</button>
    <button class="tab" role="tab" data-view="artists">Artists</button>
    <button class="tab" role="tab" data-view="todo">Needs attention <span class="badge" id="todo-badge"></span></button>
  </div>

  <div class="toolbar" id="toolbar">
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Albums, artists or songs" autocomplete="off" aria-label="Search the library">
    </label>
    <div class="chips" id="chips">
      <button class="chip" data-kind="all">All</button>
      <button class="chip" data-kind="album">Albums</button>
      <button class="chip" data-kind="single">Singles</button>
    </div>
    <select id="sort" aria-label="Sort">
      <option value="recent">Recently added</option>
      <option value="artist">Artist A–Z</option>
      <option value="title">Album A–Z</option>
      <option value="year">Year</option>
      <option value="plays">Most played</option>
    </select>
    <div class="seg" id="layout" aria-label="Layout">
      <button data-layout="grid" title="Covers">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></button>
      <button data-layout="list" title="List">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="14" height="2" rx="1"/><rect x="1" y="7" width="14" height="2" rx="1"/><rect x="1" y="12" width="14" height="2" rx="1"/></svg></button>
    </div>
    <button class="select-toggle" id="select-toggle" aria-pressed="false">Select</button>
  </div>

  <main id="main"></main>

  <p class="mock-note">Mockup · generated covers and invented data (../home-mockups/data.js). Barred covers show what a YouTube download looks like before the square-cover fix. Try: Select → tick some singles → Combine; open an album → Fetch cover; the Needs attention tab.</p>
</div>

<div id="drawer-root"></div>
<div id="bar-root"></div>
<div id="dialog-root"></div>
<div id="toast-root"></div>

<script src="../home-mockups/data.js"></script>
<script>
"use strict";

/* ===== data ================================================================ */

const PALETTES = [
  ['#1E2A44','#4EA1FF','#F2C46D','#0F1524','#7FB3E6'],
  ['#2B1D3A','#E8704A','#F5C77E','#14101C','#3B2A4F'],
  ['#12261E','#45C47A','#D8E8B0','#0A1611','#2E5E47'],
  ['#3A1620','#E0574A','#F4D3C4','#1C0B10','#8A2E3B'],
  ['#2A2A2E','#E7E9EE','#949BA8','#141418','#5B606B'],
  ['#2E2412','#E0A33E','#F7E6C1','#17110A','#7A5A24'],
];

let nextId = 1;
const days = (n) => n;
function A(artist, title, year, opts, tracks) {
  const id = nextId++;
  return {
    id, artist, title, year,
    kind: opts.kind || (tracks.length === 1 ? 'single' : 'album'),
    matched: opts.matched !== false,
    gain: opts.gain !== false,
    barred: !!opts.barred,
    youtube: !!opts.youtube,
    added: opts.added || 30,
    plays: opts.plays || 0,
    seed: artist + title,
    palette: PALETTES[(hashStr(artist) >> 2) % PALETTES.length],
    reviewed: false,
    tracks: tracks.map((t, i) => ({
      id: `${id}-${i}`, no: i + 1, title: t,
      artist: opts.trackArtist || artist,
      dur: 150 + (hashStr(t) % 170),
    })),
  };
}

let ALBUMS_DATA = [
  A('Phoebe Bridgers', 'Motion Sickness', 2017, {youtube:true, barred:true, matched:false, added:days(1), plays:41}, ['Motion Sickness']),
  A('Phoebe Bridgers', 'Scott Street', 2017, {youtube:true, barred:true, matched:false, added:days(1), plays:22}, ['Scott Street']),
  A('Phoebe Bridgers', 'Funeral', 2017, {youtube:true, barred:true, matched:false, added:days(1), plays:9}, ['Funeral']),
  A('Mitski', 'My Love Mine All Mine', 2023, {youtube:true, barred:true, matched:false, gain:false, added:days(2), plays:57}, ['My Love Mine All Mine']),
  A('Big Thief', 'Live at KEXP', 2019, {youtube:true, barred:true, matched:false, gain:false, added:days(3), plays:6}, ['Not', 'Shark Smile', 'Paul', 'Masterpiece']),
  A('Japanese Breakfast', 'Be Sweet', 2021, {youtube:true, barred:true, matched:false, added:days(4), plays:18}, ['Be Sweet']),
  A('Caroline Polachek', 'Desire, I Want to Turn Into You', 2023, {gain:false, added:days(6), plays:73},
    ['Welcome to My Island','Pretty in Possible','Bunny Is a Rider','Sunset','Crude Drawing of an Angel','I Believe','Fly to You','Blood and Butter','Hopedrunk Everasking','Butterfly Net','Smoke','Billions']),
  A('Phoebe Bridgers', 'Punisher', 2020, {added:days(9), plays:96},
    ['DVD Menu','Garden Song','Kyoto','Punisher','Halloween','Chinese Satellite','Moon Song','Savior Complex','ICU','Graceland Too','I Know the End']),
  A('Alvvays', 'Blue Rev', 2022, {added:days(12), plays:64},
    ['Pharmacist','Easy on Your Own?','After the Earthquake','Tom Verlaine','Pressed','Many Mirrors','Very Online Guy','Velveteen','Tile by Tile','Pomeranian Spinster','Belinda Says','Bored in Bristol','Lottery Noises','Fourth Figure']),
  A('boygenius', 'the record', 2023, {added:days(15), plays:156},
    ['Without You Without Them','$20','Emily I’m Sorry','True Blue','Cool About It','Not Strong Enough','Revolution 0','Leonard Cohen','Satanist','We’re in Love','Anti-Curse','Letter to an Old Poet']),
  A('Radiohead', 'In Rainbows', 2007, {added:days(20), plays:214},
    ['15 Step','Bodysnatchers','Nude','Weird Fishes/Arpeggi','All I Need','Faust Arp','Reckoner','House of Cards','Jigsaw Falling into Place','Videotape']),
  A('Fiona Apple', 'Fetch the Bolt Cutters', 2020, {added:days(26), plays:188},
    ['I Want You to Love Me','Shameika','Fetch the Bolt Cutters','Under the Table','Relay','Rack of His','Newspaper','Ladies','Heavy Balloon','Cosmonauts','For Her','Drumset','On I Go']),
  A('Bon Iver', '22, A Million', 2016, {gain:false, added:days(33), plays:142},
    ['22 (OVER S∞∞N)','10 d E A T h b R E a s T','715 - CRΣΣKS','33 “GOD”','29 #Strafford APTS','666 ʇ','21 M◊◊N WATER','8 (circle)','____45_____','1000000 Million']),
  A('Frank Ocean', 'Blonde', 2016, {matched:false, added:days(40), plays:121},
    ['Nikes','Ivy','Pink + White','Be Yourself','Solo','Skyline To','Self Control','Good Guy','Nights','Solo (Reprise)','Pretty Sweet','Facebook Story','Close to You','White Ferrari','Seigfried','Godspeed','Futura Free']),
  A('Kendrick Lamar', 'To Pimp a Butterfly', 2015, {added:days(52), plays:171},
    ['Wesley’s Theory','For Free? (Interlude)','King Kunta','Institutionalized','These Walls','u','Alright','For Sale? (Interlude)','Momma','Hood Politics','How Much a Dollar Cost','Complexion (A Zulu Love)','The Blacker the Berry','You Ain’t Gotta Lie (Momma Said)','i','Mortal Man']),
  A('Tyler, The Creator', 'IGOR', 2019, {added:days(61), plays:139},
    ['IGOR’S THEME','EARFQUAKE','I THINK','EXACTLY WHAT YOU RUN FROM YOU END UP CHASING','RUNNING OUT OF TIME','NEW MAGIC WAND','A BOY IS A GUN*','PUPPET','WHAT’S GOOD','GONE, GONE / THANK YOU','I DON’T LOVE YOU ANYMORE','ARE WE STILL FRIENDS?']),
  A('Radiohead', 'OK Computer', 1997, {added:days(80), plays:120},
    ['Airbag','Paranoid Android','Subterranean Homesick Alien','Exit Music (For a Film)','Let Down','Karma Police','Fitter Happier','Electioneering','Climbing Up the Walls','No Surprises','Lucky','The Tourist']),
  A('Fleetwood Mac', 'Rumours', 1977, {added:days(95), plays:128},
    ['Second Hand News','Dreams','Never Going Back Again','Don’t Stop','Go Your Own Way','Songbird','The Chain','You Make Loving Fun','I Don’t Want to Know','Oh Daddy','Gold Dust Woman']),
];

/* ===== state =============================================================== */

const S = {
  view: 'albums', kind: 'all', sort: 'recent', layout: 'grid', q: '',
  selecting: false, picked: new Set(), pickedTracks: new Set(),
  open: null, artist: null, menu: false, editing: false, coverPicker: false,
  dismissed: new Set(),
};
let undoSnapshot = null;

/* ===== helpers ============================================================= */

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const byId = (id) => ALBUMS_DATA.find(a => a.id === id);
const ago = (d) => d <= 1 ? 'today' : d < 7 ? `${d} days ago` : d < 30 ? `${Math.round(d / 7)} weeks ago` : `${Math.round(d / 30)} months ago`;

function art(a, cls = '') {
  const svg = albumArt(a.seed, a.palette);
  if (a.barred) return `<span class="art barred ${cls}"><span class="frame">${svg}</span></span>`;
  return `<span class="art ${cls}">${svg}</span>`;
}
const tickSvg = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2"><path d="m5 12 5 5 9-10"/></svg>';

function needs(a) {
  const out = [];
  if (a.barred) out.push('cover');
  if (!a.matched && !a.reviewed) out.push('match');
  if (!a.gain) out.push('gain');
  return out;
}

// Singles by one artist that look like the same release: the mock's stand-in
// for asking Spotify which album each single is on.
function singleGroups() {
  const by = new Map();
  for (const a of ALBUMS_DATA) {
    if (a.kind !== 'single' || !a.youtube) continue;
    const key = a.artist + '|' + a.year;
    by.set(key, [...(by.get(key) || []), a]);
  }
  const names = { 'Phoebe Bridgers|2017': 'Stranger in the Alps' };
  return [...by.entries()].filter(([, v]) => v.length > 1)
    .map(([k, v]) => ({ key: k, albums: v, guess: names[k] || `${v[0].artist} ${v[0].year}` }))
    .filter(g => !S.dismissed.has(g.key));
}

function visibleAlbums() {
  let list = ALBUMS_DATA.slice();
  if (S.kind !== 'all') list = list.filter(a => a.kind === S.kind);
  const q = S.q.trim().toLowerCase();
  if (q) list = list.filter(a => (a.title + ' ' + a.artist).toLowerCase().includes(q));
  const sorts = {
    recent: (a, b) => a.added - b.added,
    artist: (a, b) => a.artist.localeCompare(b.artist) || a.year - b.year,
    title: (a, b) => a.title.localeCompare(b.title),
    year: (a, b) => b.year - a.year,
    plays: (a, b) => b.plays - a.plays,
  };
  return list.sort(sorts[S.sort]);
}

/* ===== render: main ======================================================== */

function render() {
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === S.view));
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.kind === S.kind));
  document.querySelectorAll('#layout button').forEach(b => b.setAttribute('aria-pressed', b.dataset.layout === S.layout));
  $('#select-toggle').setAttribute('aria-pressed', S.selecting);
  $('#select-toggle').textContent = S.selecting ? 'Done' : 'Select';
  $('#chips').hidden = S.view !== 'albums';
  $('#sort').hidden = S.view === 'todo';
  $('#layout').hidden = S.view !== 'albums';

  const tracks = ALBUMS_DATA.reduce((n, a) => n + a.tracks.length, 0);
  $('#count').textContent = `${plural(ALBUMS_DATA.length, 'album')} · ${plural(tracks, 'track')}`;
  const todo = ALBUMS_DATA.filter(a => needs(a).length).length + singleGroups().length;
  $('#todo-badge').textContent = todo;
  $('#todo-badge').hidden = !todo;

  const main = $('#main');
  main.className = S.selecting ? 'selecting' : '';
  if (S.view === 'albums') main.innerHTML = renderAlbums();
  else if (S.view === 'artists') main.innerHTML = S.artist ? renderArtist(S.artist) : renderArtists();
  else main.innerHTML = renderTodo();

  renderDrawer();
  renderBar();
}

function suggestionBanner(groups) {
  return groups.map(g => `
    <div class="suggest">
      <span class="suggest-covers">${g.albums.map(a => art(a)).join('')}</span>
      <span class="suggest-text">${plural(g.albums.length, 'single')} by ${esc(g.albums[0].artist)} look like one album
        <small>All from ${g.albums[0].year} — probably <i>${esc(g.guess)}</i></small></span>
      <button class="primary" data-act="review-group" data-key="${esc(g.key)}">Combine…</button>
      <button class="bare" data-act="dismiss-group" data-key="${esc(g.key)}" aria-label="Dismiss">✕</button>
    </div>`).join('');
}

function albumCard(a) {
  const picked = S.picked.has(a.id);
  const flags = [];
  if (a.kind === 'single') flags.push('<span class="flag">SINGLE</span>');
  if (a.barred) flags.push('<span class="flag warn">COVER</span>');
  return `<div class="card ${picked ? 'picked' : ''}" tabindex="0" data-album="${a.id}">
      ${art(a)}
      <span class="flags">${flags.join('')}</span>
      <span class="tick">${tickSvg}</span>
      <div class="card-title">${esc(a.title)}</div>
      <div class="card-sub">${esc(a.artist)} · ${a.year}</div>
    </div>`;
}

function albumRow(a) {
  const picked = S.picked.has(a.id);
  const flags = [];
  if (a.kind === 'single') flags.push('<span class="flag">SINGLE</span>');
  if (a.barred) flags.push('<span class="flag warn">COVER</span>');
  if (!a.matched) flags.push('<span class="flag warn">NO MATCH</span>');
  return `<div class="row ${picked ? 'picked' : ''}" data-album="${a.id}">
      <input type="checkbox" class="tickbox" ${picked ? 'checked' : ''} tabindex="-1" aria-label="Select">
      ${art(a)}
      <div class="row-main"><div class="card-title" style="margin:0">${esc(a.title)}</div>
        <div class="card-sub">${esc(a.artist)} · ${a.year} · ${plural(a.tracks.length, 'track')}</div></div>
      <span class="flags">${flags.join('')}</span>
      <span class="row-meta hide-sm">${ago(a.added)}</span>
    </div>`;
}

function renderAlbums() {
  const list = visibleAlbums();
  const q = S.q.trim().toLowerCase();
  let html = '';
  if (!q && S.kind !== 'album') html += suggestionBanner(singleGroups());

  // Search reaches into songs too. A title you remember is often a track,
  // not the album it is on.
  if (q) {
    const hits = [];
    for (const a of ALBUMS_DATA) for (const t of a.tracks)
      if (t.title.toLowerCase().includes(q) && t.title.toLowerCase() !== a.title.toLowerCase()) hits.push([a, t]);
    if (hits.length) {
      html += `<div class="section-title">Songs <small>${hits.length}</small></div><div class="rows track-hits">` +
        hits.slice(0, 6).map(([a, t]) => `<div class="row" data-album="${a.id}">
          <span></span>${art(a)}<div class="row-main"><div class="card-title" style="margin:0">${esc(t.title)}</div>
          <div class="card-sub">${esc(a.artist)} · ${esc(a.title)}</div></div><span class="row-meta">${mmss(t.dur)}</span></div>`).join('') +
        '</div>';
    }
    html += `<div class="section-title">Albums <small>${list.length}</small></div>`;
  }
  if (!list.length) return html + '<p class="empty">Nothing matches.</p>';
  html += S.layout === 'grid'
    ? `<div class="grid">${list.map(albumCard).join('')}</div>`
    : `<div class="rows">${list.map(albumRow).join('')}</div>`;
  return html;
}

function artistStack(albums) {
  const four = albums.slice(0, 4);
  if (four.length < 4) return `<div class="stack one">${art(albums[0])}</div>`;
  return `<div class="stack">${four.map(a => art(a)).join('')}</div>`;
}

function artistsMap() {
  const m = new Map();
  for (const a of ALBUMS_DATA) m.set(a.artist, [...(m.get(a.artist) || []), a]);
  return m;
}

function renderArtists() {
  const q = S.q.trim().toLowerCase();
  let entries = [...artistsMap().entries()].filter(([n]) => !q || n.toLowerCase().includes(q));
  entries.sort(S.sort === 'plays'
    ? (x, y) => y[1].reduce((n, a) => n + a.plays, 0) - x[1].reduce((n, a) => n + a.plays, 0)
    : (x, y) => x[0].localeCompare(y[0]));
  if (!entries.length) return '<p class="empty">No artist matches.</p>';
  return `<div class="artist-grid">${entries.map(([name, albums]) => {
    const al = albums.filter(a => a.kind === 'album').length, si = albums.length - al;
    return `<div class="artist" data-artist="${esc(name)}">${artistStack(albums)}
      <div class="artist-name">${esc(name)}</div>
      <div class="artist-sub">${[al && plural(al, 'album'), si && plural(si, 'single')].filter(Boolean).join(' · ')}</div></div>`;
  }).join('')}</div>`;
}

function renderArtist(name) {
  const albums = (artistsMap().get(name) || []).sort((a, b) => b.year - a.year);
  if (!albums.length) { S.artist = null; return renderArtists(); }
  const full = albums.filter(a => a.kind === 'album'), singles = albums.filter(a => a.kind === 'single');
  const groups = singleGroups().filter(g => g.albums[0].artist === name);
  return `<button class="bare back" data-act="artists-back">‹ All artists</button>
    <div class="artist-head">${artistStack(albums)}<div><h2>${esc(name)}</h2>
      <div class="artist-sub">${plural(albums.reduce((n, a) => n + a.tracks.length, 0), 'track')} · ${albums.reduce((n, a) => n + a.plays, 0)} plays</div></div></div>
    ${suggestionBanner(groups)}
    ${full.length ? `<div class="section-title">Albums</div><div class="grid">${full.map(albumCard).join('')}</div>` : ''}
    ${singles.length ? `<div class="section-title">Singles <small>loose tracks — select a few to combine them into an album</small></div><div class="grid">${singles.map(albumCard).join('')}</div>` : ''}`;
}

function renderTodo() {
  const cover = ALBUMS_DATA.filter(a => a.barred);
  const match = ALBUMS_DATA.filter(a => !a.matched && !a.reviewed);
  const gain = ALBUMS_DATA.filter(a => !a.gain);
  const groups = singleGroups();
  const strip = (list) => `<div class="todo-strip">${list.map(a => `<div class="mini" data-album="${a.id}">${art(a)}
      <div class="mini-title">${esc(a.title)}</div><div class="mini-sub">${esc(a.artist)}</div></div>`).join('')}</div>`;
  const card = (icon, tint, title, why, list, action) => `
    <section class="todo"><div class="todo-head">
      <span class="todo-icon" style="background:${tint}">${icon}</span>
      <div class="grow"><h3>${title}</h3><p>${why}</p></div>${list.length ? action : '<span class="done">✓ All clear</span>'}
    </div>${list.length ? strip(list) : ''}</section>`;

  return `
    <section class="todo"><div class="todo-head">
      <span class="todo-icon" style="background:var(--tint-accent);color:var(--accent)">⧉</span>
      <div class="grow"><h3>Singles that belong together</h3><p>Loose YouTube downloads by one artist from the same year. Combining them makes one album.</p></div>
      ${groups.length ? '' : '<span class="done">✓ All clear</span>'}</div>
      ${groups.map(g => `<div class="group"><span class="suggest-covers">${g.albums.map(a => art(a)).join('')}</span>
        <span class="suggest-text">${esc(g.albums.map(a => a.title).join(', '))}<small>${esc(g.albums[0].artist)} · probably <i>${esc(g.guess)}</i></small></span>
        <button class="primary" data-act="review-group" data-key="${esc(g.key)}">Combine…</button></div>`).join('')}
    </section>
    ${card('▣', 'var(--tint-warn);color:var(--warn)', `Covers with bars <small style="color:var(--faint);font-weight:500">${cover.length}</small>`,
      'YouTube video frames instead of album art. Squaring keeps the picture and drops the bars.', cover,
      '<button class="primary" data-act="fix-all-covers">Square all</button>')}
    ${card('?', 'var(--panel-2);color:var(--muted)', `No MusicBrainz match <small style="color:var(--faint);font-weight:500">${match.length}</small>`,
      'Tagged the way they arrived. Open one to find a match, or mark it as fine.', match, '')}
    ${card('♪', 'var(--panel-2);color:var(--muted)', `No ReplayGain <small style="color:var(--faint);font-weight:500">${gain.length}</small>`,
      'Will play louder or quieter than everything else until measured.', gain,
      '<button data-act="gain-all">Measure all</button>')}`;
}

/* ===== render: drawer ====================================================== */

function renderDrawer() {
  const root = $('#drawer-root');
  const a = S.open && byId(S.open);
  if (!a) { root.innerHTML = ''; return; }
  const minutes = Math.round(a.tracks.reduce((n, t) => n + t.dur, 0) / 60);
  const pills = [
    a.matched ? '<span class="pill ok">MusicBrainz ✓</span>' : (a.reviewed ? '<span class="pill">Reviewed</span>' : '<span class="pill warn">No MusicBrainz match</span>'),
    a.gain ? '<span class="pill ok">ReplayGain ✓</span>' : '<span class="pill warn">No ReplayGain</span>',
    a.barred ? '<span class="pill warn">Cover has bars</span>' : '',
    a.youtube ? '<span class="pill">From YouTube</span>' : '',
  ].join('');
  const mixedArtists = new Set(a.tracks.map(t => t.artist)).size > 1;

  root.innerHTML = `
    <div class="scrim" data-act="close"></div>
    <aside class="drawer ${S.selecting ? 'selecting-tracks' : ''}" role="dialog" aria-label="${esc(a.title)}">
      <div class="drawer-top">
        <button class="bare" data-act="close" aria-label="Close">✕ Close</button>
        <button class="bare" data-act="select-in-album">${S.selecting ? 'Done selecting' : 'Select tracks'}</button>
      </div>
      <div class="drawer-body">
        <div class="hero">${art(a)}
          <div><div class="pill" style="display:inline-block;margin-bottom:6px">${a.kind === 'single' ? 'Single' : 'Album'}</div>
            <h2>${esc(a.title)}</h2>
            <span class="by" data-act="goto-artist">${esc(a.artist)}</span>
            <div class="meta">${a.year} · ${plural(a.tracks.length, 'track')} · ${minutes} min · added ${ago(a.added)} · ${a.plays} plays</div>
          </div>
        </div>
        <div class="status">${pills}</div>

        <div class="actions">
          <button data-act="edit">${S.editing ? 'Cancel edit' : 'Edit details'}</button>
          <button class="${a.barred ? 'primary' : ''}" data-act="covers">Fetch cover</button>
          <button data-act="noop" title="Asks MusicBrainz, then retags every track">Find matches</button>
          <span class="more-menu">
            <button data-act="menu" aria-haspopup="true" aria-expanded="${S.menu}">More ▾</button>
            ${S.menu ? `<div class="menu">
              <button data-act="noop">Measure ReplayGain</button>
              <button data-act="reviewed">${a.reviewed ? 'Put back on review list' : 'Mark reviewed'}</button>
              <button data-act="combine-from">Combine with other albums…</button>
              <button class="danger" data-act="noop">Quarantine album</button>
            </div>` : ''}
          </span>
        </div>

        ${S.editing ? `<div class="edit-box">
          <label>Album artist<input id="ed-artist" value="${esc(a.artist)}"></label>
          <label>Album<input id="ed-title" value="${esc(a.title)}"></label>
          <label>Year<input id="ed-year" value="${a.year}" inputmode="numeric"></label>
          <div class="btns"><button data-act="edit">Cancel</button><button class="primary" data-act="save-edit">Save</button></div>
        </div>` : ''}

        ${S.coverPicker ? `<div class="covers-head"><span>Pick a cover — only the art changes</span><button class="bare" data-act="covers">Close</button></div>
          <div class="covers">
            ${a.barred ? `<button data-act="apply-cover" data-cover="square">${art({...a, barred:false})}<span><b style="color:var(--text)">Current, squared</b><br>Bars trimmed</span></button>` : ''}
            ${[0, 1, 2].map(i => `<button data-act="apply-cover" data-cover="${i}">${art({...a, barred:false, seed:a.seed + 'alt' + i, palette:PALETTES[(i + 2) % PALETTES.length]})}
              <span>${['Spotify', 'Spotify · deluxe', 'MusicBrainz'][i]}<br>${a.year}</span></button>`).join('')}
          </div>` : ''}

        <div class="tracks-head"><h3>Tracks</h3>${S.selecting ? `<button class="bare" data-act="pick-all-tracks">Select all</button>` : ''}</div>
        <div class="tracks">${a.tracks.map(t => {
          const on = S.pickedTracks.has(t.id);
          return `<div class="trk ${on ? 'picked' : ''}" data-track="${t.id}">
            <input type="checkbox" class="tickbox" ${on ? 'checked' : ''} aria-label="Select ${esc(t.title)}">
            <span class="no">${t.no}</span>
            <span class="t"><div>${esc(t.title)}</div>${mixedArtists || t.artist !== a.artist ? `<small>${esc(t.artist)}</small>` : ''}</span>
            <span class="dur">${mmss(t.dur)}</span>
            <button class="bare edit" data-act="noop" title="Edit title, artist, number — or move to another album">✎</button>
          </div>`;
        }).join('')}</div>
      </div>
    </aside>`;
}

/* ===== render: selection bar =============================================== */

function selectionTracks() {
  // Whole albums plus loose tracks picked from other albums, in that order.
  const out = [];
  for (const id of S.picked) { const a = byId(id); if (a) a.tracks.forEach(t => out.push({ t, a })); }
  for (const a of ALBUMS_DATA) {
    if (S.picked.has(a.id)) continue;
    for (const t of a.tracks) if (S.pickedTracks.has(t.id)) out.push({ t, a });
  }
  return out;
}

function renderBar() {
  const root = $('#bar-root');
  const nA = S.picked.size, nT = [...S.pickedTracks].filter(id => !S.picked.has(+id.split('-')[0])).length;
  if (!S.selecting || $('#dialog-root').childElementCount) { root.innerHTML = ''; return; }
  const parts = [nA && plural(nA, 'album'), nT && plural(nT, 'track')].filter(Boolean);
  const total = selectionTracks().length;
  root.innerHTML = `<div class="bar" role="toolbar" aria-label="Selection">
    <span class="what">${parts.length ? `<b>${parts.join(' + ')}</b> selected` : 'Tap albums or tracks to select them'}</span>
    <button class="primary" data-act="combine" ${total < 2 ? 'disabled' : ''}>Combine into album…</button>
    <button data-act="bulk-covers" ${nA ? '' : 'disabled'}>Square covers</button>
    <button data-act="bulk-reviewed" ${nA ? '' : 'disabled'}>Mark reviewed</button>
    <button class="bare" data-act="clear">Clear</button>
  </div>`;
}

/* ===== combine dialog ====================================================== */

let C = null; // the combine form's own state

function openCombine(prefill) {
  const items = selectionTracks();
  if (items.length < 2) return;
  const sources = [...new Set(items.map(x => x.a))];
  const artists = new Map();
  items.forEach(x => artists.set(x.t.artist, (artists.get(x.t.artist) || 0) + 1));
  const topArtist = [...artists.entries()].sort((x, y) => y[1] - x[1])[0][0];
  const bigAlbum = sources.filter(a => a.kind === 'album').sort((x, y) => y.tracks.length - x.tracks.length)[0];
  C = {
    items, sources,
    target: prefill ? 'new' : (bigAlbum ? bigAlbum.id : 'new'),
    newArtist: topArtist, newTitle: prefill || '',
    various: artists.size > 1,
    renumber: true,
    cover: (sources.find(a => !a.barred) || sources[0]).id,
  };
  renderCombine();
  renderBar();
}

function renderCombine() {
  const root = $('#dialog-root');
  if (!C) { root.innerHTML = ''; return; }
  const titles = new Map();
  C.items.forEach(x => titles.set(x.t.title.toLowerCase(), (titles.get(x.t.title.toLowerCase()) || 0) + 1));
  const artistsN = new Set(C.items.map(x => x.t.artist)).size;
  const target = C.target === 'new' ? null : byId(C.target);
  const name = target ? `${target.artist} — ${target.title}` : `${C.various ? 'Various Artists' : C.newArtist || '…'} — ${C.newTitle || 'Untitled'}`;

  root.innerHTML = `<div class="dialog" data-act="combine-cancel-bg">
    <div class="sheet" role="dialog" aria-label="Combine into one album">
      <div class="sheet-head"><h2>Combine into one album</h2>
        <p>${plural(C.items.length, 'track')} from ${plural(C.sources.length, 'album')}. Nothing changes until you press Combine.</p></div>
      <div class="sheet-body">

        <div class="step"><h3>1 · Which album do they end up in?</h3>
          ${C.sources.filter(a => a.kind === 'album').map(a => `<div class="target ${C.target === a.id ? 'on' : ''}" data-act="target" data-id="${a.id}">
            <input type="radio" name="tgt" ${C.target === a.id ? 'checked' : ''}>${art(a)}
            <span>${esc(a.title)}<small>${esc(a.artist)} · keeps its name, stars and play counts</small></span></div>`).join('')}
          <div class="target ${C.target === 'new' ? 'on' : ''}" data-act="target" data-id="new">
            <input type="radio" name="tgt" ${C.target === 'new' ? 'checked' : ''}><span class="plus">+</span>
            <span>A new album<small>Or type the name of one you already have — they join it</small></span></div>
          ${C.target === 'new' ? `<div class="fields">
            <label>Album artist<input id="cb-artist" value="${esc(C.various ? 'Various Artists' : C.newArtist)}" ${C.various ? 'disabled' : ''}></label>
            <label>Album<input id="cb-title" value="${esc(C.newTitle)}" placeholder="e.g. Stranger in the Alps"></label>
          </div>` : ''}
          ${artistsN > 1 ? `<label class="opt"><input type="checkbox" data-act="various" ${C.various ? 'checked' : ''}>
            These are by ${artistsN} artists — file as Various Artists, keep each track's own artist</label>` : ''}
        </div>

        <div class="step"><h3>2 · Track order</h3>
          <div class="order" id="order">${C.items.map((x, i) => {
            const dupe = titles.get(x.t.title.toLowerCase()) > 1;
            return `<div class="ord" draggable="true" data-i="${i}">
              <span class="grip" aria-hidden="true">⋮⋮</span>
              <span class="no">${C.renumber ? i + 1 : x.t.no}</span>
              <span class="t">${esc(x.t.title)} ${dupe ? '<span class="dupe">· same title twice</span>' : ''}<br><span class="from">from ${esc(x.a.title)}</span></span>
              <span class="from">${mmss(x.t.dur)}</span>
              <span class="moves"><button data-act="up" data-i="${i}" aria-label="Move up">↑</button><button data-act="down" data-i="${i}" aria-label="Move down">↓</button></span>
            </div>`;
          }).join('')}</div>
          <label class="opt"><input type="checkbox" data-act="renumber" ${C.renumber ? 'checked' : ''}> Renumber 1–${C.items.length} in this order</label>
          ${[...titles.values()].some(n => n > 1) ? '<p class="note warn">Two tracks share a title. They will both be kept — the Duplicates panel can pick one later.</p>' : ''}
        </div>

        <div class="step"><h3>3 · Cover</h3>
          <div class="cover-pick">${C.sources.map(a => `<label title="${esc(a.title)}"><input type="radio" name="cv" data-act="cover" data-id="${a.id}" ${C.cover === a.id ? 'checked' : ''}>${art({...a, barred:false})}</label>`).join('')}</div>
          <p class="note">YouTube covers are squared first, so none of these keep their bars.</p>
        </div>
      </div>
      <div class="sheet-foot">
        <span class="summary">Into <b style="color:var(--text)">${esc(name)}</b></span>
        <button data-act="combine-cancel">Cancel</button>
        <button class="primary" data-act="combine-go">Combine ${plural(C.items.length, 'track')}</button>
      </div>
    </div></div>`;
  wireDrag();
}

function wireDrag() {
  let from = null;
  document.querySelectorAll('.ord').forEach(row => {
    row.addEventListener('dragstart', () => { from = +row.dataset.i; row.classList.add('dragging'); });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', (e) => { e.preventDefault(); row.classList.add('over'); });
    row.addEventListener('dragleave', () => row.classList.remove('over'));
    row.addEventListener('drop', (e) => {
      e.preventDefault();
      const to = +row.dataset.i;
      if (from === null || from === to) return;
      const [m] = C.items.splice(from, 1); C.items.splice(to, 0, m);
      renderCombine();
    });
  });
}

function doCombine() {
  undoSnapshot = JSON.parse(JSON.stringify(ALBUMS_DATA));
  const coverFrom = byId(C.cover);
  let target;
  if (C.target === 'new') {
    const t = ($('#cb-title') && $('#cb-title').value.trim()) || C.newTitle || 'Untitled';
    const ar = C.various ? 'Various Artists' : (($('#cb-artist') && $('#cb-artist').value.trim()) || C.newArtist);
    target = A(ar, t, Math.max(...C.sources.map(a => a.year)), {kind: 'album', added: 0}, []);
    ALBUMS_DATA.push(target);
  } else target = byId(C.target);

  const moved = C.items.map(x => ({...x.t}));
  // Take every chosen track out of wherever it was.
  for (const a of ALBUMS_DATA) a.tracks = a.tracks.filter(t => !C.items.some(x => x.t.id === t.id));
  // Whatever the target kept (tracks of it nobody picked) stay first; the
  // chosen ones follow in the order the dialog set.
  target.tracks = [...target.tracks, ...moved];
  target.tracks.forEach((t, i) => { if (C.renumber) t.no = i + 1; t.id = `${target.id}-${i}`; });
  target.kind = target.tracks.length > 1 ? 'album' : 'single';
  target.seed = coverFrom.seed; target.palette = coverFrom.palette; target.barred = false;
  target.plays = C.sources.reduce((n, a) => n + a.plays, 0);
  target.youtube = C.sources.every(a => a.youtube);
  target.matched = C.sources.every(a => a.matched);
  target.gain = C.sources.every(a => a.gain);
  ALBUMS_DATA = ALBUMS_DATA.filter(a => a.tracks.length);
  S.picked.clear(); S.pickedTracks.clear(); S.selecting = false; S.open = null;
  C = null; renderCombine();
  toast(`Combined into ${target.title} — ${plural(target.tracks.length, 'track')}.`, true);
  render();
}

/* ===== toast =============================================================== */

let toastTimer;
function toast(msg, undo) {
  clearTimeout(toastTimer);
  $('#toast-root').innerHTML = `<div class="toast" role="status">${esc(msg)}${undo ? '<button class="bare" data-act="undo">Undo</button>' : ''}</div>`;
  toastTimer = setTimeout(() => { $('#toast-root').innerHTML = ''; }, 6000);
}

/* ===== events ============================================================== */

function toggleAlbum(id) {
  S.picked.has(id) ? S.picked.delete(id) : S.picked.add(id);
}

document.addEventListener('click', (e) => {
  const actEl = e.target.closest('[data-act]');
  const act = actEl && actEl.dataset.act;

  if (act) {
    const a = S.open && byId(S.open);
    switch (act) {
      case 'close': S.open = null; S.menu = S.editing = S.coverPicker = false; render(); return;
      case 'menu': S.menu = !S.menu; renderDrawer(); return;
      case 'edit': S.editing = !S.editing; S.menu = false; renderDrawer(); return;
      case 'save-edit':
        a.artist = $('#ed-artist').value.trim() || a.artist;
        a.title = $('#ed-title').value.trim() || a.title;
        a.year = +$('#ed-year').value || a.year;
        S.editing = false; toast('Saved. Files moved to match.'); render(); return;
      case 'covers': S.coverPicker = !S.coverPicker; S.menu = false; renderDrawer(); return;
      case 'apply-cover': {
        const c = actEl.dataset.cover;
        if (c !== 'square') { a.seed = a.seed + 'alt' + c; a.palette = PALETTES[(+c + 2) % PALETTES.length]; }
        a.barred = false; S.coverPicker = false;
        toast(`New cover on ${plural(a.tracks.length, 'track')}. Nothing else changed.`); render(); return;
      }
      case 'reviewed': a.reviewed = !a.reviewed; S.menu = false; render(); return;
      case 'goto-artist': S.view = 'artists'; S.artist = a.artist; S.open = null; render(); return;
      case 'artists-back': S.artist = null; render(); return;
      case 'select-in-album': S.selecting = !S.selecting; render(); return;
      case 'pick-all-tracks': a.tracks.forEach(t => S.pickedTracks.add(t.id)); render(); return;
      case 'combine-from':
        S.selecting = true; S.picked.add(a.id); S.open = null; S.menu = false;
        S.view = 'albums'; render();
        toast(`${a.title} is selected. Pick the albums or tracks to combine with it.`); return;
      case 'review-group': {
        const g = singleGroups().find(x => x.key === actEl.dataset.key);
        S.selecting = true; S.picked = new Set(g.albums.map(x => x.id)); S.pickedTracks.clear();
        render(); openCombine(g.guess); return;
      }
      case 'dismiss-group': S.dismissed.add(actEl.dataset.key); render(); return;
      case 'fix-all-covers': {
        const n = ALBUMS_DATA.filter(x => x.barred).length;
        ALBUMS_DATA.forEach(x => { x.barred = false; });
        toast(`Squared ${plural(n, 'cover')}.`); render(); return;
      }
      case 'gain-all': ALBUMS_DATA.forEach(x => { x.gain = true; }); toast('Measuring — progress shows here as it goes.'); render(); return;
      case 'clear': S.picked.clear(); S.pickedTracks.clear(); render(); return;
      case 'combine': openCombine(); return;
      case 'bulk-covers': [...S.picked].forEach(id => { byId(id).barred = false; }); toast(`Squared ${plural(S.picked.size, 'cover')}.`); render(); return;
      case 'bulk-reviewed': [...S.picked].forEach(id => { byId(id).reviewed = true; }); toast(`Marked ${plural(S.picked.size, 'album')} reviewed.`); render(); return;
      case 'target': C.target = actEl.dataset.id === 'new' ? 'new' : +actEl.dataset.id; renderCombine(); return;
      case 'various': C.various = actEl.checked; renderCombine(); return;
      case 'renumber': C.renumber = actEl.checked; renderCombine(); return;
      case 'cover': C.cover = +actEl.dataset.id; return;
      case 'up': case 'down': {
        const i = +actEl.dataset.i, j = act === 'up' ? i - 1 : i + 1;
        if (j < 0 || j >= C.items.length) return;
        [C.items[i], C.items[j]] = [C.items[j], C.items[i]]; renderCombine(); return;
      }
      case 'combine-cancel': C = null; renderCombine(); renderBar(); return;
      case 'combine-cancel-bg': if (e.target === actEl) { C = null; renderCombine(); renderBar(); } return;
      case 'combine-go': doCombine(); return;
      case 'undo': if (undoSnapshot) { ALBUMS_DATA = undoSnapshot; undoSnapshot = null; $('#toast-root').innerHTML = ''; render(); } return;
      case 'noop': toast('Mockup — this would do what it says.'); return;
    }
  }

  if (S.menu && !e.target.closest('.more-menu')) { S.menu = false; renderDrawer(); }

  const trk = e.target.closest('.trk');
  if (trk && S.selecting) {
    const id = trk.dataset.track;
    S.pickedTracks.has(id) ? S.pickedTracks.delete(id) : S.pickedTracks.add(id);
    renderDrawer(); renderBar(); return;
  }

  const albumEl = e.target.closest('[data-album]');
  if (albumEl) {
    const id = +albumEl.dataset.album;
    if (S.selecting && !albumEl.closest('.track-hits') && !albumEl.classList.contains('mini')) { toggleAlbum(id); render(); return; }
    S.open = id; S.menu = S.editing = S.coverPicker = false; render(); return;
  }

  const artistEl = e.target.closest('[data-artist]');
  if (artistEl) { S.artist = artistEl.dataset.artist; render(); window.scrollTo(0, 0); }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'cb-title') C.newTitle = e.target.value;
  if (e.target.id === 'cb-artist') C.newArtist = e.target.value;
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (C) { C = null; renderCombine(); renderBar(); }
    else if (S.open) { S.open = null; render(); }
    else if (S.selecting) { S.selecting = false; render(); }
  }
  if (e.key === 'Enter' && e.target.classList.contains('card')) e.target.click();
});

$('#tabs').addEventListener('click', (e) => {
  const t = e.target.closest('.tab'); if (!t) return;
  S.view = t.dataset.view; S.artist = null; render();
});
$('#chips').addEventListener('click', (e) => {
  const c = e.target.closest('.chip'); if (!c) return; S.kind = c.dataset.kind; render();
});
$('#layout').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return; S.layout = b.dataset.layout; render();
});
$('#sort').addEventListener('change', (e) => { S.sort = e.target.value; render(); });
$('#q').addEventListener('input', (e) => { S.q = e.target.value; render(); });
$('#select-toggle').addEventListener('click', () => {
  S.selecting = !S.selecting;
  if (!S.selecting) { S.picked.clear(); S.pickedTracks.clear(); }
  render();
});

render();
</script>
</body>
</html>
