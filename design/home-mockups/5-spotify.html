<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotify-style — Home mockup 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121212;
    --surface:#181818;
    --surface-hover:#242424;
    --text:#FFFFFF;
    --text-dim:#B3B3B3;
    --text-faint:#7A7A7A;
    --green:#1ED760;
    --green-deep:#0E6B2E;
    --font:'Sofia Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  main{max-width:1080px;margin:0 auto;padding-bottom:70px;}
  a{color:inherit;}

  /* ---- header ---- */
  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 20px;
    position:sticky;top:0;
    background:rgba(18,18,18,0.85);
    backdrop-filter:blur(10px);
    z-index:10;
  }
  .wordmark{font-weight:800;font-size:1.05rem;letter-spacing:-0.01em;}
  .avatar{
    width:30px;height:30px;border-radius:50%;
    background:var(--surface-hover);
    display:flex;align-items:center;justify-content:center;
    font-size:0.75rem;font-weight:700;
    border:none;color:var(--text);
    cursor:pointer;
  }

  /* ---- hero (the fade) ---- */
  .hero{
    position:relative;
    padding:8px 20px 28px;
    overflow:hidden;
  }
  .hero-wash{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,
      var(--hero-c1, #4f3a7a) 0%,
      var(--hero-c2, #2a2044) 42%,
      var(--bg) 88%);
    opacity:0.9;
    z-index:0;
  }
  .hero-inner{position:relative;z-index:1;}
  .eyebrow{
    font-size:0.86rem;
    font-weight:600;
    color:rgba(255,255,255,0.85);
    margin:18px 0 20px;
  }
  .hero-cover{
    display:flex;
    gap:20px;
    align-items:flex-end;
  }
  .hero-art{
    width:112px;height:112px;
    flex:0 0 auto;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 16px 34px -10px rgba(0,0,0,0.65);
  }
  .hero-art svg{display:block;width:100%;height:100%;}
  .hero-title{
    font-weight:800;
    font-size:clamp(1.7rem, 7vw, 2.8rem);
    line-height:1.02;
    letter-spacing:-0.01em;
    margin:0 0 8px;
  }
  .hero-meta{
    font-size:0.84rem;
    color:rgba(255,255,255,0.75);
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .hero-meta .dot{opacity:0.5;}

  /* ---- shortcuts grid ---- */
  section{padding:0 20px;margin-bottom:34px;}
  .quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:18px;
  }
  .quick-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border-radius:4px;
    overflow:hidden;
    transition:background 0.15s ease;
    cursor:pointer;
  }
  .quick-card:hover{background:var(--surface-hover);}
  .quick-art{width:56px;height:56px;flex:0 0 auto;}
  .quick-art svg{display:block;width:100%;height:100%;}
  .quick-name{
    font-size:0.86rem;
    font-weight:700;
    padding-right:10px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* ---- shelf ---- */
  .shelf-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
  }
  .shelf-title{font-size:1.3rem;font-weight:800;margin:0;}
  .shelf-see{font-size:0.78rem;font-weight:700;color:var(--text-dim);}
  .shelf{
    display:flex;
    gap:18px;
    overflow-x:auto;
    padding-bottom:6px;
    scrollbar-width:none;
  }
  .shelf::-webkit-scrollbar{display:none;}

  .tile{
    flex:0 0 148px;
    position:relative;
    padding-bottom:14px;
  }
  .tile-glow{
    position:absolute;
    left:8px;right:8px;
    bottom:0;
    height:60%;
    background:var(--glow, transparent);
    filter:blur(22px);
    opacity:0.55;
    z-index:0;
    border-radius:50%;
  }
  .tile-art{
    position:relative;
    z-index:1;
    width:148px;height:148px;
    border-radius:6px;
    overflow:hidden;
    box-shadow:0 10px 24px -12px rgba(0,0,0,0.7);
  }
  .tile.round .tile-art{border-radius:50%;}
  .tile-art svg{display:block;width:100%;height:100%;}
  .play-btn{
    position:absolute;
    right:8px;bottom:24px;
    width:40px;height:40px;
    border-radius:50%;
    background:var(--green);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 16px -4px rgba(0,0,0,0.6);
    opacity:0;
    transform:translateY(6px);
    transition:opacity 0.15s ease, transform 0.15s ease;
    z-index:2;
  }
  .tile:hover .play-btn{opacity:1;transform:translateY(0);}
  .play-btn svg{width:16px;height:16px;}
  .tile-title{
    position:relative;z-index:1;
    font-size:0.85rem;
    font-weight:700;
    margin-top:10px;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tile-sub{
    position:relative;z-index:1;
    font-size:0.76rem;
    color:var(--text-dim);
    margin-top:2px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tile.round{text-align:center;}

  /* ---- stats strip ---- */
  .stat-strip{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
  }
  .stat-card{
    background:var(--surface);
    border-radius:8px;
    padding:16px 14px;
  }
  .stat-value{
    font-size:1.5rem;
    font-weight:800;
    display:block;
  }
  .stat-label{
    font-size:0.74rem;
    color:var(--text-dim);
    margin-top:2px;
  }

  /* ---- month chart ---- */
  .months{
    display:flex;
    align-items:flex-end;
    gap:6px;
    height:96px;
    margin-top:18px;
    padding:0 2px;
  }
  .month-bar{
    flex:1;
    background:var(--text-faint);
    border-radius:2px 2px 0 0;
    min-width:8px;
    transition:background 0.15s ease;
  }
  .month-bar.peak{background:var(--green);}
  .month-labels{display:flex;gap:6px;margin-top:8px;padding:0 2px;}
  .month-labels span{flex:1;text-align:center;font-size:0.66rem;color:var(--text-faint);}

  @media(min-width:700px){
    .hero{padding:8px 40px 36px;}
    .hero-art{width:180px;height:180px;}
    section{padding:0 40px;}
    .quick-grid{grid-template-columns:repeat(3,1fr);}
    .stat-strip{grid-template-columns:repeat(3,1fr);max-width:520px;}
  }
</style>
</head>
<body>
<main>

  <header>
    <span class="wordmark">Download Center</span>
    <button class="avatar" aria-label="Account">A</button>
  </header>

  <section class="hero" id="hero" style="padding-left:0;padding-right:0;">
    <div class="hero-wash" id="hero-wash"></div>
    <div class="hero-inner" style="padding:0 20px;">
      <p class="eyebrow" id="greeting">Good evening</p>
      <div class="hero-cover">
        <div class="hero-art" id="hero-art"></div>
        <div>
          <h1 class="hero-title">Your 2026,<br>so far</h1>
          <p class="hero-meta">
            <span>340 hours</span><span class="dot">·</span>
            <span>1,842 tracks</span><span class="dot">·</span>
            <span>64 artists</span>
          </p>
        </div>
      </div>
    </div>
  </section>

  <section>
    <div class="quick-grid" id="quick-grid"></div>
  </section>

  <section>
    <div class="shelf-head">
      <h2 class="shelf-title">Most played artists</h2>
      <span class="shelf-see">Last 12 months</span>
    </div>
    <div class="shelf" id="artist-shelf"></div>
  </section>

  <section>
    <div class="shelf-head">
      <h2 class="shelf-title">Top albums this year</h2>
      <span class="shelf-see">See all</span>
    </div>
    <div class="shelf" id="album-shelf"></div>
  </section>

  <section>
    <div class="shelf-head"><h2 class="shelf-title">Plays by month</h2></div>
    <div class="months" id="months"></div>
    <div class="month-labels" id="month-labels"></div>
  </section>

  <section>
    <div class="stat-strip">
      <div class="stat-card"><span class="stat-value">8h 14m</span><span class="stat-label">Longest session</span></div>
      <div class="stat-card"><span class="stat-value">106</span><span class="stat-label">Tracks in it</span></div>
      <div class="stat-card"><span class="stat-value">4,080</span><span class="stat-label">Sessions, all time</span></div>
    </div>
  </section>

</main>

<script src="data.js"></script>
<script>
  document.getElementById('greeting').textContent = greeting().replace(', Alex', '');

  // A cool, print-safe palette to draw generated covers from - the hero
  // wash and each tile's glow are tinted straight from the same colors,
  // so art and background always agree with each other.
  const ART_PALETTE = ['#4F3A7A', '#8B5CF6', '#D6BCFA', '#1A1330', '#2A2044'];

  const PLAY_ICON = '<svg viewBox="0 0 24 24" fill="#000"><path d="M8 5v14l11-7z"/></svg>';

  function artEl(seed, sizeClass){
    return `${albumArt(seed, ART_PALETTE)}`;
  }

  // Hero: the top album's cover, its own colors washed down the page
  // behind it so the cover reads as if it fades straight into the
  // background rather than sitting on a hard edge.
  const feature = ALBUMS[0];
  const heroSeed = feature.title + feature.artist;
  const heroColors = pickColors(heroSeed, ART_PALETTE);
  document.getElementById('hero-wash').style.setProperty('--hero-c1', heroColors.fg);
  document.getElementById('hero-wash').style.setProperty('--hero-c2', heroColors.bg);
  document.getElementById('hero-art').innerHTML = artEl(heroSeed);

  const quickGrid = document.getElementById('quick-grid');
  ALBUMS.slice(0, 6).forEach(al => {
    const card = document.createElement('div');
    card.className = 'quick-card';
    card.innerHTML = `
      <div class="quick-art">${artEl(al.title + al.artist)}</div>
      <span class="quick-name">${al.title}</span>`;
    quickGrid.appendChild(card);
  });

  const artistShelf = document.getElementById('artist-shelf');
  ARTISTS.forEach(a => {
    const tile = document.createElement('div');
    tile.className = 'tile round';
    const c = pickColors(a.name, ART_PALETTE);
    tile.innerHTML = `
      <div class="tile-glow" style="--glow:${c.fg}"></div>
      <div class="tile-art">${albumArt(a.name, ART_PALETTE)}</div>
      <div class="play-btn">${PLAY_ICON}</div>
      <div class="tile-title">${a.name}</div>
      <div class="tile-sub">${a.plays} plays</div>`;
    artistShelf.appendChild(tile);
  });

  const albumShelf = document.getElementById('album-shelf');
  ALBUMS.forEach(al => {
    const tile = document.createElement('div');
    tile.className = 'tile';
    const seed = al.title + al.artist;
    const c = pickColors(seed, ART_PALETTE);
    tile.innerHTML = `
      <div class="tile-glow" style="--glow:${c.fg}"></div>
      <div class="tile-art">${artEl(seed)}</div>
      <div class="play-btn">${PLAY_ICON}</div>
      <div class="tile-title">${al.title}</div>
      <div class="tile-sub">${al.artist}</div>`;
    albumShelf.appendChild(tile);
  });

  const monthsWrap = document.getElementById('months');
  const labelsWrap = document.getElementById('month-labels');
  const maxPlays = Math.max(...MONTHS.map(m => m.plays));
  MONTHS.forEach(m => {
    const bar = document.createElement('div');
    bar.className = 'month-bar' + (m.plays === maxPlays ? ' peak' : '');
    bar.style.height = Math.max(6, (m.plays / maxPlays) * 100) + '%';
    monthsWrap.appendChild(bar);
    const label = document.createElement('span');
    label.textContent = m.label;
    labelsWrap.appendChild(label);
  });
</script>
</body>
</html>
