<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic fade — Home redesign B</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* B: the header is your six most-played covers, tiled edge to edge.
     The bottom two rows dissolve into the page, and the stats are set into
     that dissolve. The hourly curve is the only chart here, because it is
     the one number Navidrome cannot give at all. */
  :root{
    --bg:#0C0E10;
    --text:#EEF2F0;
    --text-dim:#9AA5A0;
    --text-faint:#5E6864;
    --accent:#7FE0C0;
    --line:rgba(238,242,240,0.10);
    --font:'Sora', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  main{position:relative;max-width:1080px;margin:0 auto;padding-bottom:80px;}

  .header{position:relative;overflow:hidden;}
  .mosaic{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-auto-rows:min(34vw, 200px);
    gap:2px;
    height:calc(min(34vw, 200px) * 2 + 2px);
  }
  .tile svg{width:100%;height:100%;display:block;}
  .tile{position:relative;overflow:hidden;}
  .tile.lift{filter:none;}
  .header-fade{
    position:absolute;left:0;right:0;bottom:0;height:72%;
    background:linear-gradient(180deg,
      rgba(12,14,16,0) 0%,
      rgba(12,14,16,0.7) 45%,
      var(--bg) 92%);
    pointer-events:none;
  }
  .header-copy{
    position:absolute;left:0;right:0;bottom:6px;z-index:2;
    padding:0 20px;
  }
  .wordmark-row{
    position:absolute;top:0;left:0;right:0;z-index:2;
    display:flex;justify-content:space-between;align-items:center;
    padding:16px 20px;
  }
  .wordmark{font-weight:700;font-size:0.9rem;letter-spacing:0.03em;}
  .menu{
    width:36px;height:30px;background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;justify-content:space-between;padding:3px 0;
  }
  .menu span{display:block;height:2px;background:var(--text);border-radius:2px;}
  .greeting{font-size:0.9rem;color:var(--text-dim);margin:0 0 6px;}
  .fact{font-size:clamp(1.6rem, 5vw, 2.4rem);font-weight:700;line-height:1.1;margin:0;letter-spacing:-0.01em;}
  .fact em{font-style:normal;color:var(--accent);}

  .stats{
    position:relative;z-index:2;
    display:grid;grid-template-columns:repeat(3, 1fr);
    margin:-6px 20px 0;
    gap:12px;
  }
  .stat{
    background:rgba(238,242,240,0.04);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 14px;
    backdrop-filter:blur(10px);
  }
  .stat-value{display:block;font-size:clamp(1.5rem, 4vw, 2.1rem);font-weight:700;letter-spacing:-0.02em;line-height:1;}
  .stat-label{display:block;margin-top:8px;font-size:0.76rem;color:var(--text-dim);line-height:1.35;}

  .section{padding:40px 20px 0;}
  .section-title{font-size:0.95rem;font-weight:600;margin:0 0 4px;}
  .section-note{font-size:0.78rem;color:var(--text-faint);margin:0 0 20px;display:block;}

  .hours{
    display:grid;grid-template-columns:repeat(24, 1fr);align-items:end;gap:3px;height:120px;
  }
  .hour{
    border-radius:3px 3px 1px 1px;
    background:linear-gradient(180deg, var(--accent), rgba(127,224,192,0.15));
    min-height:2px;
  }
  .hour-axis{
    display:flex;justify-content:space-between;margin-top:8px;
    font-size:0.7rem;color:var(--text-faint);
  }

  .top-list{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;}
  .top-item{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line);}
  .top-rank{width:18px;font-size:0.8rem;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .top-name{flex:1;font-size:0.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-count{font-size:0.8rem;color:var(--text-dim);font-variant-numeric:tabular-nums;}

  @media (min-width: 760px){
    .mosaic{grid-template-columns:repeat(6, 1fr);grid-auto-rows:auto;height:300px;}
    .header-fade{height:80%;}
    .stats{margin:-10px 0 0;}
    .section{padding-left:0;padding-right:0;}
    .top-list{grid-template-columns:repeat(3, 1fr);}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<main>

  <header class="header">
    <div class="mosaic" id="mosaic" aria-label="Your most-played albums"></div>
    <div class="header-fade"></div>

    <div class="wordmark-row">
      <span class="wordmark">Navidrome Companion</span>
      <button class="menu" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>

    <div class="header-copy">
      <p class="greeting" id="greeting"></p>
      <p class="fact" id="fact"></p>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="Summary"></section>

  <section class="section">
    <h2 class="section-title">Listening by hour</h2>
    <span class="section-note">When in the day your plays happen, last year</span>
    <div class="hours" id="hours"></div>
    <div class="hour-axis"><span>midnight</span><span>noon</span><span>11pm</span></div>
  </section>

  <section class="section">
    <h2 class="section-title">Top albums</h2>
    <span class="section-note">Last 12 months</span>
    <div class="top-list" id="top"></div>
  </section>

</main>

<script src="../home-mockups/data.js"></script>
<script>
  // Cool and quiet, to sit against a dark page: mint, slate, and a deep
  // teal for the shadows so the covers don't look pasted on.
  const ART_PALETTE = ['#0F3B36', '#7FE0C0', '#D6F2EA', '#0C0E10', '#24403B'];

  const covers = ALBUMS.slice(0, 6);
  document.getElementById('mosaic').innerHTML = covers.map(al =>
    `<div class="tile">${albumArt(al.title + al.artist, ART_PALETTE)}</div>`).join('');

  document.getElementById('greeting').textContent = greeting();
  document.getElementById('fact').innerHTML =
    'Your most-played artist is <em>' + FACTS.topArtist + '</em>';

  const stats = [
    [FACTS.tracksThisYear, 'tracks this year'],
    [FACTS.hoursThisYear, 'hours listened'],
    [FACTS.longestSessionHours + 'h ' + FACTS.longestSessionMinutes + 'm', 'longest session'],
  ];
  document.getElementById('stats').innerHTML = stats.map(([v, l]) =>
    `<div class="stat"><span class="stat-value">${typeof v === 'number' ? v.toLocaleString() : v}</span>
     <span class="stat-label">${l}</span></div>`).join('');

  const peak = Math.max(...HOURLY);
  document.getElementById('hours').innerHTML = HOURLY.map((n, h) =>
    `<div class="hour" title="${h}:00 — ${n} plays" style="height:${Math.max(2, (n / peak) * 100)}%"></div>`).join('');

  document.getElementById('top').innerHTML = ALBUMS.map((al, i) =>
    `<div class="top-item">
       <span class="top-rank">${i + 1}</span>
       <span class="top-name">${al.title}</span>
       <span class="top-count">${al.plays}</span>
     </div>`).join('');
</script>
</body>
</html>
