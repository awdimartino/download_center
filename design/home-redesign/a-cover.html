<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover fade — Home redesign A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  /* A: one full-width cover is the header. Its bottom dissolves into the
     page, and the numbers sit on that dissolve rather than below a rule. */
  :root{
    --bg:#0E0D12;
    --text:#F4F1EC;
    --text-dim:#A8A29A;
    --text-faint:#6E6862;
    --accent:#F5A36B;
    --line:rgba(244,241,236,0.10);
    --font:'Manrope', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  main{position:relative;max-width:1080px;margin:0 auto;padding-bottom:80px;}

  /* ---- header: the cover and its fade ---- */
  .hero{
    position:relative;
    height:min(120vw, 640px);
    min-height:460px;
    overflow:hidden;
  }
  .hero-art{position:absolute;inset:0;}
  .hero-art svg{width:100%;height:100%;display:block;transform:scale(1.06);}
  .hero-fade{
    position:absolute;inset:0;
    background:linear-gradient(180deg,
      rgba(14,13,18,0.45) 0%,
      rgba(14,13,18,0) 26%,
      rgba(14,13,18,0.35) 55%,
      rgba(14,13,18,0.92) 82%,
      var(--bg) 100%);
  }
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:2;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;
  }
  .wordmark{font-weight:800;font-size:0.95rem;letter-spacing:0.02em;}
  .menu{
    width:36px;height:30px;background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;justify-content:space-between;padding:3px 0;
  }
  .menu span{display:block;height:2px;background:var(--text);border-radius:2px;}
  .chip{
    position:absolute;top:70px;left:20px;z-index:2;
    font-size:0.74rem;font-weight:700;letter-spacing:0.04em;
    background:rgba(14,13,18,0.5);backdrop-filter:blur(8px);
    padding:6px 11px;border-radius:999px;color:var(--text-dim);
  }
  .hero-copy{
    position:absolute;left:0;right:0;bottom:150px;z-index:2;
    padding:0 24px;
  }
  .greeting{
    font-size:0.92rem;color:var(--text-dim);margin:0 0 14px;
  }
  .fact-lead{
    font-size:0.8rem;text-transform:uppercase;letter-spacing:0.14em;
    font-weight:700;color:var(--accent);margin:0 0 8px;
  }
  .fact-value{
    font-size:clamp(2.6rem, 9vw, 5.4rem);
    font-weight:800;line-height:0.95;letter-spacing:-0.025em;
    margin:0 0 12px;
    text-shadow:0 2px 28px rgba(0,0,0,0.4);
  }
  .fact-tail{margin:0;color:var(--text-dim);font-size:1rem;}

  /* ---- stats: they start where the fade is nearly black ---- */
  .stats{
    position:relative;z-index:2;
    margin-top:-40px;
    display:grid;grid-template-columns:repeat(3, 1fr);
    gap:0;padding:0 20px;
  }
  .stat{padding:4px 12px 4px 0;}
  .stat + .stat{padding-left:14px;border-left:1px solid var(--line);}
  .stat-value{
    display:block;font-size:clamp(1.7rem, 4.5vw, 2.5rem);
    font-weight:800;letter-spacing:-0.02em;line-height:1;
  }
  .stat-label{display:block;margin-top:6px;font-size:0.8rem;color:var(--text-dim);line-height:1.35;}

  /* ---- detail ---- */
  .section{padding:44px 20px 0;}
  .section-head{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:18px;
  }
  .section-title{font-size:1.05rem;font-weight:700;margin:0;}
  .section-note{font-size:0.8rem;color:var(--text-faint);}

  .months{
    display:flex;align-items:flex-end;gap:8px;height:170px;
  }
  .month{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .month-bar{
    width:100%;border-radius:6px 6px 2px 2px;
    background:linear-gradient(180deg, var(--accent), rgba(245,163,107,0.25));
  }
  .month.peak .month-bar{background:var(--accent);box-shadow:0 0 22px rgba(245,163,107,0.35);}
  .month-label{margin-top:8px;font-size:0.7rem;color:var(--text-faint);}

  .artist-row{
    display:grid;grid-template-columns:1fr 2fr auto;align-items:center;gap:14px;
    padding:11px 0;border-top:1px solid var(--line);font-size:0.93rem;
  }
  .artist-row:last-child{border-bottom:1px solid var(--line);}
  .artist-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .artist-track{height:6px;background:rgba(244,241,236,0.07);border-radius:3px;overflow:hidden;}
  .artist-fill{height:100%;background:var(--text);border-radius:3px;opacity:0.85;}
  .artist-count{font-variant-numeric:tabular-nums;color:var(--text-dim);font-size:0.85rem;}

  @media (min-width: 760px){
    .hero{height:560px;}
    .stats{margin-top:-56px;}
    .section{padding-left:0;padding-right:0;}
    .section-head{padding:0;}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<main>

  <header class="hero" aria-label="Top album">
    <div class="hero-art" id="hero-art"></div>
    <div class="hero-fade"></div>

    <div class="topbar">
      <span class="wordmark">Navidrome Companion</span>
      <button class="menu" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
    <div class="chip" id="chip"></div>

    <div class="hero-copy">
      <p class="greeting" id="greeting"></p>
      <p class="fact-lead">Your most-played artist is</p>
      <p class="fact-value" id="fact-value"></p>
      <p class="fact-tail" id="fact-tail"></p>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="Summary"></section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title">Plays by month</h2>
      <span class="section-note">Last 12 months</span>
    </div>
    <div class="months" id="months"></div>
  </section>

  <section class="section">
    <div class="section-head">
      <h2 class="section-title">Most played artists</h2>
      <span class="section-note">Last 12 months</span>
    </div>
    <div id="artists"></div>
  </section>

</main>

<script src="../home-mockups/data.js"></script>
<script>
  // Same palette family as the rest of the redesign set, so A/B/C can be
  // compared on the same art. Warm, with one bright ember for the fade.
  const ART_PALETTE = ['#2B1D3A', '#E8704A', '#F5C77E', '#14101C', '#3B2A4F'];

  const feature = ALBUMS[0];
  document.getElementById('hero-art').innerHTML =
    albumArt(feature.title + feature.artist, ART_PALETTE);
  document.getElementById('chip').textContent =
    'Top album · ' + feature.title + ' — ' + feature.artist;

  document.getElementById('greeting').textContent = greeting();
  document.getElementById('fact-value').textContent = FACTS.topArtist;
  document.getElementById('fact-tail').textContent =
    FACTS.topArtistPlays.toLocaleString() + ' plays in the last year';

  const stats = [
    [FACTS.tracksThisYear, 'different tracks in ' + FACTS.year],
    [FACTS.hoursThisYear, 'hours listened in ' + FACTS.year],
    [FACTS.artistsHeard, 'artists heard this year'],
  ];
  document.getElementById('stats').innerHTML = stats.map(([v, l]) =>
    `<div class="stat"><span class="stat-value">${v.toLocaleString()}</span>
     <span class="stat-label">${l}</span></div>`).join('');

  const peak = Math.max(...MONTHS.map(m => m.plays));
  document.getElementById('months').innerHTML = MONTHS.map(m =>
    `<div class="month ${m.plays === peak ? 'peak' : ''}" title="${m.label}: ${m.plays} plays">
       <div class="month-bar" style="height:${(m.plays / peak) * 100}%"></div>
       <span class="month-label">${m.label}</span>
     </div>`).join('');

  const topPlays = ARTISTS[0].plays;
  document.getElementById('artists').innerHTML = ARTISTS.map(a =>
    `<div class="artist-row">
       <span class="artist-name">${a.name}</span>
       <span class="artist-track"><span class="artist-fill" style="display:block;width:${(a.plays / topPlays) * 100}%"></span></span>
       <span class="artist-count">${a.plays}</span>
     </div>`).join('');
</script>
</body>
</html>
