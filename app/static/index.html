<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download Center</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Download Center</h1>
  <nav class="tabs">
    <button class="tab active" data-view="queue" type="button">Queue</button>
    <button class="tab" data-view="browse" type="button">Browse</button>
  </nav>
  <span id="conn" class="conn offline">connecting</span>
  <button id="settings-toggle" class="ghost" type="button">Settings</button>
</header>

<main>
  <form id="settings" hidden autocomplete="off">
    <label>Spotify client ID<input name="spotify_client_id" type="text" spellcheck="false"></label>
    <label>Spotify client secret<input name="spotify_client_secret" type="password" placeholder="unchanged"></label>
    <label>Concurrent downloads<input name="concurrency" type="number" min="1" max="10"></label>
    <label>MP3 bitrate<input name="audio_bitrate" type="text"></label>
    <label>Attempts per track<input name="max_attempts" type="number" min="1" max="10"></label>
    <label>Pause between downloads (s)<input name="rate_limit_sleep" type="number" min="0" step="0.5"></label>
    <div class="settings-actions">
      <button type="submit">Save</button>
      <span id="settings-note"></span>
    </div>
  </form>

  <p id="error" class="error" hidden></p>
  <p id="warn" class="warn" hidden></p>

  <section id="view-queue">
    <form id="add-form" autocomplete="off">
      <input id="url" type="text" spellcheck="false"
             placeholder="Paste a Spotify link, or a YouTube / SoundCloud / Bandcamp URL">
      <button type="submit">Add</button>
    </form>
    <section id="jobs"></section>
    <p id="empty" class="empty">Nothing queued yet.</p>
  </section>

  <section id="view-browse" hidden>
    <form id="search-form" autocomplete="off">
      <input id="query" type="text" spellcheck="false" placeholder="Search Spotify">
      <div class="kinds">
        <button class="kind active" data-kind="album" type="button">Albums</button>
        <button class="kind" data-kind="track" type="button">Tracks</button>
        <button class="kind" data-kind="artist" type="button">Artists</button>
      </div>
    </form>
    <p id="crumb" class="crumb" hidden></p>
    <div id="results" class="grid"></div>
    <p id="browse-empty" class="empty">Search for an artist, album, or track.</p>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
