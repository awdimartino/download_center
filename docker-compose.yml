services:
  navidrome-companion:
    # Pulls the published multi-arch image (amd64 + arm64).
    # To build from source instead, comment this out and uncomment `build`.
    image: ${NC_IMAGE:-ghcr.io/awdimartino/navidrome-companion:latest}
    # build: .

    container_name: navidrome-companion
    restart: unless-stopped
    # Time to stop downloads and let an operation finish the file it is on
    # before Docker kills the process. Docker's default is ten seconds, which
    # can land part way through rewriting a file in the library.
    stop_grace_period: 2m

    ports:
      - "${PORT:-8000}:8000"

    environment:
      # Must match the user that owns LIBRARY_DIR, or the files written here
      # will not be readable by whatever serves your library.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}

      # Where Navidrome answers, as seen from inside this container. Required
      # to sign in. Can be set in the Settings panel instead, except that
      # nobody can reach the Settings panel without signing in first.
      NC_NAVIDROME_URL: ${NC_NAVIDROME_URL:-}

      # Optional: keeps credentials out of the config volume entirely.
      NC_SPOTIFY_CLIENT_ID: ${NC_SPOTIFY_CLIENT_ID:-}
      NC_SPOTIFY_CLIENT_SECRET: ${NC_SPOTIFY_CLIENT_SECRET:-}

    volumes:
      # config.toml, state.db, each person's beets config and an optional
      # cookies.txt. state.db holds the only copy of your listening history
      # and album identities: back it up.
      - ${CONFIG_DIR:-./config}:/config

      # Scratch space: one inbox per person and library. Downloads are built
      # here and leave as soon as they are filed, so at rest it is empty.
      - ${WORKSPACE_DIR:-./workspace}:/downloads

      # The library, at the SAME path Navidrome mounts it. Navidrome reports
      # where a library lives from its own database, and that path is used
      # here as-is. Add one line per library, e.g. a second person's:
      #   - /srv/music/kelly:/kelly
      - ${LIBRARY_DIR:-./library}:/music

      # Navidrome's data directory, read-only. The directory and not just
      # navidrome.db: Navidrome runs SQLite in WAL mode, and reading it needs
      # the -wal and -shm files beside it.
      #
      # NOT optional. Which libraries an account may see is read from here,
      # so without it every user signs in with no library, no download has
      # anywhere to go, and Health has nothing to report.
      - ${NAVIDROME_DATA_DIR:-./navidrome-data}:/navidrome:ro
