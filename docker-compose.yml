services:
  download-center:
    # Pulls the published multi-arch image (amd64 + arm64).
    # Set DC_IMAGE in .env to your own ghcr.io path.
    # To build from source instead, comment this out and uncomment `build`.
    image: ${DC_IMAGE:-ghcr.io/awdimartino/download_center:latest}
    # build: .

    container_name: download-center
    restart: unless-stopped

    ports:
      - "${PORT:-8000}:8000"

    environment:
      # Must match the user that owns LIBRARY_DIR, or the files written here
      # will not be readable by whatever serves your library.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}

      # Optional: keeps credentials out of the config volume entirely.
      DC_SPOTIFY_CLIENT_ID: ${DC_SPOTIFY_CLIENT_ID:-}
      DC_SPOTIFY_CLIENT_SECRET: ${DC_SPOTIFY_CLIENT_SECRET:-}

    volumes:
      # config.toml, the download ledger, and an optional cookies.txt.
      # state.db lives here: back it up.
      - ${CONFIG_DIR:-./config}:/config

      # Staging. Downloads land here, and beets moves them out. albums/ and
      # singles/ are created inside it.
      - ${STAGING_DIR:-./untagged}:/downloads

      # The tagged library beets files into, using the paths in each person's
      # own config at /config/beets/<username>-<library id>/config.yaml.
      # This is what Navidrome should index.
      - ${LIBRARY_DIR:-./library}:/music

      # Navidrome's database. Uncomment and point at your navidrome.db.
      # Read-only on purpose: Navidrome owns this file and caches from it, so
      # nothing here ever writes to it.
      #
      # This is NOT optional. Which libraries an account may see is read from
      # this file, so without it every user signs in with no library, no
      # download has anywhere to go, and Health has nothing to report.
      # - /path/to/navidrome/navidrome.db:/navidrome/navidrome.db:ro
